// ACTIONS
// ══════════════════════════════════════════
function changeInputDate(val) {
  selectedDate = val;
  updateNavTitle();
  renderInput();
}

function setShift(dateKey, shiftId) {
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  appData[dateKey].shift = shiftId;
  delete appData[dateKey].customLabel;
  delete appData[dateKey].customStart;
  delete appData[dateKey].customEnd;
  // 予定未定選択時はシフト・業務データを全消去
  if (shiftId === null) {
    delete appData[dateKey].compoundKobans;
    delete appData[dateKey].compoundKobanModes;
    delete appData[dateKey].compoundPartialData;
    delete appData[dateKey].compoundManualStart;
    delete appData[dateKey].compoundManualEnd;
    delete appData[dateKey].taskContents;
    delete appData[dateKey].workItems;
    delete appData[dateKey].multiWorkStart;
    delete appData[dateKey].multiWorkEnd;
    delete appData[dateKey].trainingLabel;
    delete appData[dateKey].trainingStart;
    delete appData[dateKey].trainingEnd;
  }
  saveData(appData);
  renderInput();
}

// ── 生活時刻の手動変更 → 逆算欄にも反映 ──
function onLifeChange(dateKey, field, val) {
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  if (!appData[dateKey].life) appData[dateKey].life = {};
  appData[dateKey].life[field] = val;
  // 逆算欄を上書きなしで更新（到着時刻→各区間は変えない）
  _syncCalcFromLife(dateKey);
  saveData(appData);
}

// 生活時刻から逆算欄の到着時刻を逆算して更新
function _syncCalcFromLife(dateKey) {
  const rec = appData[dateKey];
  if (!rec || !rec.life) return;
  const life = rec.life;
  const calc = rec.calc || {};
  // commuteがあれば到着時刻を逆算
  const commuteMin = parseTime(life.commute);
  if (commuteMin !== null) {
    const a2c = calc.arriveToCommute !== undefined ? calc.arriveToCommute : 90;
    // arrive = commute - a2c
    let arriveMin = commuteMin - a2c;
    if (arriveMin < 0) arriveMin += 1440;
    if (!appData[dateKey].calc) appData[dateKey].calc = {};
    appData[dateKey].calc.arriveTime = fmtMin(arriveMin);
  }
}

// ── 逆算プルダウン変更 → 生活時刻に反映 ──
function onCalcChange(dateKey) {
  const arriveEl = document.getElementById('calc_arrive');
  const a2cEl    = document.getElementById('calc_a2c');
  const c2rEl    = document.getElementById('calc_c2r');
  const r2wEl    = document.getElementById('calc_r2w');
  const shEl     = document.getElementById('calc_sh');
  const smEl     = document.getElementById('calc_sm');
  if (!arriveEl) return;

  const arriveTime   = arriveEl.value;
  const arriveToCommute = parseInt(a2cEl.value);
  const commuteToReady  = parseInt(c2rEl.value);
  const readyToWake     = parseInt(r2wEl.value);
  const sleepH          = parseInt(shEl.value);
  const sleepM          = parseInt(smEl.value);
  const sleepTotal      = sleepH * 60 + sleepM;

  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  if (!appData[dateKey].life) appData[dateKey].life = {};
  if (!appData[dateKey].calc) appData[dateKey].calc = {};

  // 設定値を保存
  appData[dateKey].calc = { arriveTime, arriveToCommute, commuteToReady, readyToWake, sleepH, sleepM };

  if (arriveTime) {
    const arriveMin  = parseTime(arriveTime);
    const commuteMin = (arriveMin - arriveToCommute + 1440) % 1440;
    const readyMin   = (commuteMin - commuteToReady + 1440) % 1440;
    const wakeMin    = (readyMin - readyToWake + 1440) % 1440;
    const sleepMin   = (wakeMin - sleepTotal + 1440) % 1440;

    appData[dateKey].life.commute = fmtMin(commuteMin);
    appData[dateKey].life.ready   = fmtMin(readyMin);
    appData[dateKey].life.wake    = fmtMin(wakeMin);
    appData[dateKey].life.sleep   = fmtMin(sleepMin);

    // DOM即時反映
    const fields = ['commute','ready','wake','sleep'];
    const vals   = [commuteMin, readyMin, wakeMin, sleepMin];
    fields.forEach((f, i) => {
      const el = document.getElementById('life_' + f);
      if (el) el.value = fmtMin(vals[i]);
    });
  }
  saveData(appData);
}

function setCustomShift(dateKey) {
  const label = document.getElementById('custLabel').value.trim() || 'カスタム';
  const start = document.getElementById('custStart').value;
  const end   = document.getElementById('custEnd').value;
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  appData[dateKey].shift = 'custom';
  appData[dateKey].customLabel = label;
  appData[dateKey].customStart = start;
  appData[dateKey].customEnd   = end;
  saveData(appData);
  renderInput();
}

// ── 複合業務・業務習得 ──
function setShiftMode(dateKey, mode) {
  if (mode === 'compound' || mode === 'training') {
    if (!appData[dateKey]) appData[dateKey] = { life: {} };
    appData[dateKey].shift = mode;
    if (mode === 'compound') {
      window._compoundState = { dateKey, koban: null, search: '' };
    }
    saveData(appData);
    renderInput();
  } else {
    setShift(dateKey, mode);
  }
}

function saveCompoundLabel(dateKey, val) {
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  appData[dateKey].compoundLabel = val;
  saveData(appData);
}

function saveCompoundManualTime(dateKey, field, val) {
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  if (field === 'start') appData[dateKey].compoundManualStart = val;
  if (field === 'end')   appData[dateKey].compoundManualEnd   = val;
  saveData(appData);
  // renderInput() は呼ばない（入力が強制終了されるのを防ぐ）
}

function clearCompoundManualTime(dateKey) {
  if (!appData[dateKey]) return;
  delete appData[dateKey].compoundManualStart;
  delete appData[dateKey].compoundManualEnd;
  saveData(appData);
  renderInput();
}


function filterCompoundKoban(dateKey, val) {
  if (!window._compoundState) window._compoundState = {};
  window._compoundState.dateKey = dateKey;
  window._compoundState.search = val.replace('交番','').trim();
  renderInput();
}

// 全部/一部モード切替
function setKobanMode(dateKey, kobanNum, mode) {
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  if (!appData[dateKey].compoundKobanModes) appData[dateKey].compoundKobanModes = {};
  appData[dateKey].compoundKobanModes[kobanNum] = mode;
  // 全部モードに切り替えた場合は路線選択を全クリア→全路線を自動セット
  if (mode === 'all') {
    const isNew = (() => { const cfg=loadNewKobanConfig(); return cfg&&cfg.effectiveDate&&dateKey>=cfg.effectiveDate; })();
    const d = new Date(dateKey); const dow = d.getDay();
    const shu = dow===6?'土曜':dow===0?'日祝':'平日';
    const {routes: effRoutes} = getEffectiveRoutes(isNew?'new':'cur', shu, kobanNum);
    // 全部モードの交番の路線は saved から削除（全部担当は routes に入れず modes で管理）
    if (appData[dateKey].compoundRoutes) {
      appData[dateKey].compoundRoutes = appData[dateKey].compoundRoutes.filter(r =>
        !effRoutes.some(er => er.no === r.no)
      );
    }
  }
  saveData(appData);
  renderInput();
}

// 一部モード手入力の保存
function savePartialField(dateKey, kobanNum, field, value) {
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  if (!appData[dateKey].compoundPartialData) appData[dateKey].compoundPartialData = {};
  if (!appData[dateKey].compoundPartialData[kobanNum]) appData[dateKey].compoundPartialData[kobanNum] = {};
  appData[dateKey].compoundPartialData[kobanNum][field] = value;
  saveData(appData);
}


// 複数交番トグル（追加/削除）
function toggleCompoundKoban(dateKey, kobanNum) {
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  let kobans = appData[dateKey].compoundKobans || [];
  const idx = kobans.indexOf(kobanNum);
  if (idx === -1) { kobans.push(kobanNum); }
  else { kobans.splice(idx, 1); }
  appData[dateKey].compoundKobans = kobans;
  saveData(appData);
  renderInput();
}

// 旧selectCompoundKoban互換（念のため残す）
function selectCompoundKoban(dateKey, kobanNum) {
  toggleCompoundKoban(dateKey, kobanNum);
}


// ── 作業内容（taskContents）管理 ──
function toggleTaskForm(dateKey) {
  if (window._taskFormOpen === dateKey) {
    window._taskFormOpen = null;
  } else {
    window._taskFormOpen = dateKey;
    window._taskFormState = { type: '業務習得', customName: '', start: '', end: '' };
  }
  renderInput();
}

function setTaskFormType(dateKey, type) {
  if (!window._taskFormState) window._taskFormState = {};
  window._taskFormState.type = type;
  renderInput();
}

function setTaskFormCustom(dateKey, val) {
  if (!window._taskFormState) window._taskFormState = {};
  window._taskFormState.customName = val;
}

function setTaskFormTime(dateKey, field, val) {
  if (!window._taskFormState) window._taskFormState = {};
  window._taskFormState[field] = val;
}

function registerTaskContent(dateKey) {
  const fs = window._taskFormState || {};
  const name = fs.type === 'その他' ? (fs.customName || 'その他').trim() : fs.type;
  const start = fs.start || '';
  const end   = fs.end   || '';
  if (!name) { showToast('⚠️ 作業名を入力してください'); return; }
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  if (!appData[dateKey].taskContents) appData[dateKey].taskContents = [];
  appData[dateKey].taskContents.push({ name, start, end });
  // 「その他」で新名称なら今後のプリセットに追加
  if (fs.type === 'その他' && name && !['業務習得','車庫整理'].includes(name)) {
    if (!appData[dateKey].taskPresets) appData[dateKey].taskPresets = ['業務習得','車庫整理'];
    if (!appData[dateKey].taskPresets.includes(name)) appData[dateKey].taskPresets.push(name);
  }
  window._taskFormOpen = null;
  window._taskFormState = null;
  saveData(appData);
  renderInput();
}

function deleteTaskContent(dateKey, idx) {
  if (!appData[dateKey] || !appData[dateKey].taskContents) return;
  appData[dateKey].taskContents.splice(idx, 1);
  saveData(appData);
  renderInput();
}

function saveTraining(dateKey) {
  const label = document.getElementById('trainingLabel').value.trim();
  const start = document.getElementById('trainingStart').value;
  const end   = document.getElementById('trainingEnd').value;
  if (!appData[dateKey]) appData[dateKey] = { life: {} };
  if (!appData[dateKey].life) appData[dateKey].life = {};
  appData[dateKey].trainingLabel = label;
  appData[dateKey].trainingStart = start;
  appData[dateKey].trainingEnd   = end;
  // 交番が未設定の場合はtrainingを単独シフトとして扱う
  if (!appData[dateKey].shift || appData[dateKey].shift === 'training') {
    appData[dateKey].shift = 'training';
  }
  // 開始時刻があれば逆算セクションに反映
  if (start) {
    if (!appData[dateKey].calc) appData[dateKey].calc = {};
    const calc = appData[dateKey].calc;
    appData[dateKey].calc.arriveTime = start;
    const a2c = calc.arriveToCommute !== undefined ? calc.arriveToCommute : 90;
    const c2r = calc.commuteToReady  !== undefined ? calc.commuteToReady  : 5;
    const r2w = calc.readyToWake     !== undefined ? calc.readyToWake     : 5;
    const sh  = calc.sleepH          !== undefined ? calc.sleepH          : 6;
    const sm  = calc.sleepM          !== undefined ? calc.sleepM          : 30;
    const arriveMin  = parseTime(start);
    const commuteMin = (arriveMin - a2c + 1440) % 1440;
    const readyMin   = (commuteMin - c2r + 1440) % 1440;
    const wakeMin    = (readyMin - r2w + 1440) % 1440;
    const sleepMin   = (wakeMin - (sh*60+sm) + 1440) % 1440;
    appData[dateKey].life.commute = fmtMin(commuteMin);
    appData[dateKey].life.ready   = fmtMin(readyMin);
    appData[dateKey].life.wake    = fmtMin(wakeMin);
    appData[dateKey].life.sleep   = fmtMin(sleepMin);
  }
  saveData(appData);
  renderInput();
}

function clearTraining(dateKey) {
  if (!appData[dateKey]) return;
  delete appData[dateKey].trainingLabel;
  delete appData[dateKey].trainingStart;
  delete appData[dateKey].trainingEnd;
  if (appData[dateKey].shift === 'training') appData[dateKey].shift = null;
  saveData(appData);

// LIST PRINT
// ══════════════════════════════════════════
function showPrintModal() {
  // モーダルが既にあれば削除
  const existing = document.getElementById('printModal');
  if (existing) existing.remove();

  const year = cursor.getFullYear(), month = cursor.getMonth();
  let selectedStart = null;

  function buildModal() {
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const startDow = new Date(year, month, 1).getDay();
    const DOW_LABELS = ['日','月','火','水','木','金','土'];

    // ミニカレンダーのセル生成
    let cells = '';
    // 前月の空白
    for (let i = 0; i < startDow; i++) cells += `<div></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = fmtDate(new Date(year, month, d));
      const dow = new Date(year, month, d).getDay();
      const isToday = dateKey === fmtDate(today);
      const isSelected = dateKey === selectedStart;
      // 選択済みの場合、10日間のレンジ計算
      let inRange = false;
      if (selectedStart) {
        const selD = new Date(selectedStart);
        const endD = new Date(selectedStart);
        endD.setDate(endD.getDate() + 9);
        const thisD = new Date(year, month, d);
        inRange = thisD >= selD && thisD <= endD;
      }
      const dowCls = dow === 0 ? 'color:#e03535;' : dow === 6 ? 'color:#0ea8d8;' : '';
      let bg = '#fff', border = '1.5px solid transparent';
      if (isSelected) { bg = '#d4f5e5'; border = '1.5px solid #3dbf7a'; }
      else if (inRange) { bg = '#e8f7f9'; }
      else if (isToday) { bg = '#0ea8d8'; }
      const color = isToday && !isSelected ? '#fff' : '';
      const borderRadius = isToday && !isSelected ? '50%' : '6px';
      cells += `<div onclick="window._printSelDate='${dateKey}';document.getElementById('printModal').remove();showPrintModal();"
        style="text-align:center;font-size:13px;font-weight:600;padding:5px 2px;border-radius:${borderRadius};cursor:pointer;
        background:${bg};border:${border};color:${dowCls||color};font-family:'DM Mono',monospace;transition:background .1s;"
        onmouseover="if(this.style.background!='#d4f5e5')this.style.background='#f0fafb'"
        onmouseout="if(this.style.background!='#d4f5e5')this.style.background='${bg}'">${d}</div>`;
    }

    // ヒントテキスト
    let hint = '開始日をタップしてください';
    if (selectedStart) {
      const endD = new Date(selectedStart); endD.setDate(endD.getDate()+9);
      hint = `📅 ${selectedStart.slice(5).replace('-','/')}（${DOW[new Date(selectedStart).getDay()]}）から10日間 → ${fmtDate(endD).slice(5).replace('-','/')} まで印刷`;
    }

    return `<div id="printModal" style="position:fixed;inset:0;z-index:9000;background:rgba(13,42,48,0.5);display:flex;align-items:center;justify-content:center;padding:16px;">
      <div style="background:#fff;border-radius:16px;border:1.5px solid var(--border2);width:100%;max-width:340px;box-shadow:0 8px 32px rgba(14,168,216,.2);overflow:hidden;">
        <div style="background:var(--accent);padding:14px 16px;font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;">
          🖨️ 印刷する期間を選択
        </div>
        <div style="padding:16px;">
          <div style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px;">開始日をタップしてください</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:14px;font-weight:700;color:var(--text);">${year}年${month+1}月</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;">
            ${DOW_LABELS.map((d,i)=>`<div style="text-align:center;font-size:10px;font-weight:700;padding:2px 0;color:${i===0?'#e03535':i===6?'#0ea8d8':'var(--muted)'};">${d}</div>`).join('')}
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px;">${cells}</div>
          <div style="font-size:12px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 12px;border:1px solid var(--border);margin-bottom:14px;">${hint}</div>
          <div style="display:flex;gap:8px;">
            <button onclick="document.getElementById('printModal').remove();window._printSelDate=null;" style="flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--border2);background:#fff;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;font-family:var(--sans);">キャンセル</button>
            <button onclick="${selectedStart ? `printList('${selectedStart}')` : ''}" style="flex:2;padding:11px;border-radius:10px;border:none;background:${selectedStart?'var(--accent)':'#b8e4ec'};font-size:14px;font-weight:700;color:#fff;cursor:${selectedStart?'pointer':'default'};font-family:var(--sans);">🖨️ この範囲で印刷</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  // 前回の選択を引き継ぐ
  selectedStart = window._printSelDate || null;
  document.body.insertAdjacentHTML('beforeend', buildModal());
}

function printList(startDateKey) {

  const startD = new Date(startDateKey);
  const endD = new Date(startDateKey); endD.setDate(endD.getDate()+9);
  const title = `${startD.getFullYear()}年${startD.getMonth()+1}月${startD.getDate()}日（${DOW_JP[startD.getDay()]}）〜 ${endD.getMonth()+1}月${endD.getDate()}日（${DOW_JP[endD.getDay()]}）`;
  const printDate = fmtDate(today);

  let rows = '';
  for (let i = 0; i < 10; i++) {
    const d = new Date(startDateKey); d.setDate(d.getDate()+i);
    const dateKey = fmtDate(d);
    const dow = d.getDay();
    const info = getShiftInfo(dateKey);
    const rec = appData[dateKey] || {};
    const life = rec.life || {};

    const dowColor = dow === 0 ? '#e03535' : dow === 6 ? '#0ea8d8' : '#5a8a96';
    const numColor = dow === 0 ? '#e03535' : dow === 6 ? '#0ea8d8' : '#0d2a30';
    const isToday = dateKey === fmtDate(today);
    const rowBg = isToday ? '#e8f9fc' : '#fff';

    // バッジ
    let badge = '', timeRange = '';
    if (info) {
      const bc = info.type==='work'?'#c8eef8;color:#0878a0':info.type==='holiday'||info.type==='paid'||info.type==='off'?'#ffd9d9;color:#c01010':'#ffe5b0;color:#a06000';
      badge = `<span style="background:${bc.split(';')[0]};${bc.split(';')[1]};font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;">${info.label}</span>`;
      if (info.start && info.end) timeRange = `<span style="font-size:22px;font-weight:700;color:#0d2a30;font-family:'DM Mono',monospace;margin-left:4px;">${info.start}–${info.end}</span>`;
    } else {
      badge = `<span style="font-size:11px;color:#5a8a96;">— 未入力 —</span>`;
    }

    // サマリー
    function metCell(label, val, cls) {
      const bg = cls==='ok'?'#d4f5e5':cls==='warn'?'#fff4df':cls==='bad'?'#ffd9d9':'#f0fafb';
      const co = cls==='ok'?'#0a5e2a':cls==='warn'?'#a06000':cls==='bad'?'#c01010':'#5a8a96';
      return `<span style="font-size:10px;color:#5a8a96;margin-right:2px;">${label}</span><span style="font-size:11px;font-weight:700;background:${bg};color:${co};border-radius:3px;padding:1px 5px;font-family:'DM Mono',monospace;margin-right:6px;">${val}</span>`;
    }
    let workVal='—', workCls='none';
    if (info&&info.start&&info.end){const wm=diffMin(parseTime(info.start),parseTime(info.end));workVal=fmtMin(wm);workCls=wm>780?'warn':'ok';}
    const im=getIntervalHours(dateKey);
    const sm=getSleepHours(dateKey);

    rows += `<div style="display:grid;grid-template-columns:44px 1fr;border-bottom:1px solid #e0eff2;background:${rowBg};">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px;border-right:1px solid #e0eff2;background:#f5fbfc;">
        <div style="font-size:10px;font-weight:700;color:${dowColor};">${DOW_JP[dow]}</div>
        <div style="font-size:${isToday?'14px':'17px'};font-weight:600;color:${isToday?'#fff':numColor};font-family:'DM Mono',monospace;line-height:1;${isToday?`background:var(--accent);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;`:''}">${d.getDate()}</div>
      </div>
      <div>
        <div style="display:flex;align-items:center;padding:5px 8px;gap:6px;flex-wrap:wrap;">
          ${badge}${timeRange}
          <span style="font-size:11px;color:#b8e4ec;margin:0 2px;">|</span>
          ${metCell('勤務時間', workVal, workCls)}
          ${metCell('勤務間', im===null?'—':fmtMin(im), im===null?'none':im<600?'bad':im<660?'warn':'ok')}
          ${metCell('睡眠', sm===null?'—':fmtMin(sm), sm===null?'none':sm<360?'bad':sm<420?'warn':'ok')}
        </div>
        <div style="display:flex;align-items:center;padding:6px 8px;gap:12px;background:#f8fdfe;border-top:1px dashed #d0eaf0;flex-wrap:wrap;">
          <span style="font-size:20px;font-weight:600;font-family:'DM Mono',monospace;">💤${life.sleep||'—'}</span>
          <span style="font-size:20px;font-weight:600;font-family:'DM Mono',monospace;">☀️${life.wake||'—'}</span>
          <span style="font-size:20px;font-weight:600;font-family:'DM Mono',monospace;">🚿${life.ready||'—'}</span>
          <span style="font-size:20px;font-weight:600;font-family:'DM Mono',monospace;">🚃${life.commute||'—'}</span>
        </div>
      </div>
    </div>`;
  }

  const w = window.open('','_blank','width=794,height=1123');
  w.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
  <title>TIME TABLE ${title}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=DM+Mono:wght@400;700&display=swap');
    @page { size: A4 portrait; margin: 15mm 12mm; }
    body { font-family:'Noto Sans JP',sans-serif; margin:0; padding:0; background:#fff; color:#0d2a30; }
    .header { display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid #0ea8d8; padding-bottom:8px; margin-bottom:12px; }
    .header-title { font-size:14px; font-weight:700; color:#0ea8d8; letter-spacing:1px; }
    .header-range { font-size:11px; color:#5a8a96; font-family:'DM Mono',monospace; }
    .footer { margin-top:10px; text-align:right; font-size:9px; color:#5a8a96; }
    .print-btn { position:fixed; bottom:20px; right:20px; padding:10px 24px; background:#0ea8d8; border:none; border-radius:8px; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
    @media print { .print-btn { display:none; } }
  </style>
  </head><body>
  <div class="header">
    <div class="header-title">MK-86 TIME TABLE</div>
    <div class="header-range">${title}</div>
  </div>
  ${rows}
  <div class="footer">印刷日：${printDate}</div>
  <button class="print-btn" onclick="window.print()">🖨️ 印刷する</button>
  </body></html>`);
  w.document.close();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── 日ビュー入力パネル開閉 ──
function toggleDayInput(dateKey) {
  window._dayInputOpen = (window._dayInputOpen === dateKey) ? null : dateKey;
  render();
}

// ── 休日クリア ──
function clearHoliday(dateKey) {
  if (!appData[dateKey]) appData[dateKey] = {};
  appData[dateKey].shift = undefined;
  delete appData[dateKey].shift;
  saveData(appData);
  render();
}

// ── 業務クリア ──
function clearShift(dateKey) {
  if (!confirm('業務内容（CODE・複合勤務）を削除しますか？')) return;
  if (!appData[dateKey]) return;
  delete appData[dateKey].shift;
  delete appData[dateKey].compoundKobans;
  delete appData[dateKey].compoundKobanModes;
  delete appData[dateKey].compoundPartialData;
  delete appData[dateKey].compoundManualStart;
  delete appData[dateKey].compoundManualEnd;
  delete appData[dateKey].taskContents;
  saveData(appData);
  render();
}

function updateNewCodeStatus() {
  const el = document.getElementById('newCodeStatus');
  const inp = document.getElementById('newCodeDateInput');
  if (!el) return;
  const cfg = loadNewKobanConfig();
  if (cfg && cfg.effectiveDate) {
    const today = new Date().toISOString().slice(0,10);
    const isActive = today >= cfg.effectiveDate;
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">
        <span style="font-size:12px;color:var(--muted);">現在の状態</span>
        <span style="font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;background:${isActive?'#c8eef8':'#ffd9d9'};color:${isActive?'#0878a0':'#c01010'};">
          ${isActive ? '新CODE適用中' : '新CODE未開始'}
        </span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:12px;color:var(--muted);">切替有効日</span>
        <span style="font-size:16px;font-weight:700;color:var(--text);font-family:var(--mono);">${cfg.effectiveDate}</span>
      </div>`;
    if (inp) inp.value = cfg.effectiveDate;
  } else {
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:12px;color:var(--muted);">現在の状態</span>
        <span style="font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;background:#d4f5e5;color:#0a7a3e;">旧CODE使用中（未設定）</span>
      </div>`;
  }
}

function setNewCodeDate() {
  const inp = document.getElementById('newCodeDateInput');
  if (!inp || !inp.value) { alert('有効日を選択してください'); return; }
  saveNewKobanConfig({ effectiveDate: inp.value });
  updateNewCodeStatus();
  alert('新CODEの有効日を設定しました：' + inp.value);
}

function clearNewCodeDate() {
  if (!confirm('新CODE設定を解除して旧CODEに戻しますか？')) return;
  delete appData.newKobanConfig;
  saveData(appData);
  localStorage.removeItem(NEW_KOBAN_KEY);
  updateNewCodeStatus();
  alert('新CODE設定を解除しました。旧CODEを使用します。');
}

// FIREBASE FIRESTORE 同期

(async function initFirebase() {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getFirestore, doc, setDoc, onSnapshot, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

    const firebaseConfig = {
      apiKey: "AIzaSyCIqSyfHwHg5ygdyB5XA6KBsIDqiyLQLgU",
      authDomain: "schedule-app-d1ba4.firebaseapp.com",
      projectId: "schedule-app-d1ba4",
      storageBucket: "schedule-app-d1ba4.firebasestorage.app",
      messagingSenderId: "350863090121",
      appId: "1:350863090121:web:b3283d3895cdb0670c4818"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "schedules", "mkdata");
    const irodoriDocRef = doc(db, "schedules", "irodori_mkdata");

    // ローカル保存中フラグ（自分の書き込みによるonSnapshotを無視）
    let isSavingLocally = false;

    function setSyncStatus(status) {
      const dot = document.getElementById('syncDot');
      const txt = document.getElementById('syncText');
      if (!dot || !txt) return;
      if (status === 'ok') {
        dot.style.background = '#2ecf7a';
        txt.textContent = '同期済み';
      } else if (status === 'syncing') {
        dot.style.background = '#e08a10';
        txt.textContent = '同期中…';
      } else {
        dot.style.background = '#e03535';
        txt.textContent = 'オフライン';
      }
    }

    // TIMETABLEデータ と IRODORIデータ を並列取得してから render
    try {
      const snap = await getDoc(docRef);

      // IRODORIデータをオプション取得（失敗してもオフライン扱いにしない）
      try {
        const irodoriSnap = await getDoc(irodoriDocRef);
        if (irodoriSnap.exists()) {
          window._irodoriCloudData = irodoriSnap.data().appData || {};
        }
      } catch(irodoriErr) {
        console.warn('IRODORIデータ取得スキップ:', irodoriErr);
      }

      // TIMETABLEデータをセット
      if (snap.exists()) {
        const cloudData = snap.data().appData || {};
        Object.keys(cloudData).forEach(k => { appData[k] = cloudData[k]; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      }
      setSyncStatus('ok');
    } catch(e) {
      console.warn('初回取得エラー:', e);
      setSyncStatus('offline');
    }

    // 両データ取得完了後に一度だけrender
    render();

    // リアルタイム購読（他デバイスの変更を反映）
    onSnapshot(irodoriDocRef, (snap) => {
      if (snap.exists()) {
        window._irodoriCloudData = snap.data().appData || {};
        render();
      }
    });

    // リアルタイム監視（他デバイスの変更を自動反映）
    // 自分の書き込み起因のsnapshotは無視してUI上書きを防ぐ
    onSnapshot(docRef, (snap) => {
      if (isSavingLocally) return; // 自分の保存中は無視
      if (snap.exists()) {
        const cloudData = snap.data().appData || {};
        Object.keys(cloudData).forEach(k => { appData[k] = cloudData[k]; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        render();
        setSyncStatus('ok');
      }
    }, (err) => {
      console.warn('onSnapshotエラー:', err);
      setSyncStatus('offline');
    });

    // firestoreSaveをセット（saveData内から呼ばれる）
    firestoreSave = function(d) {
      setSyncStatus('syncing');
      isSavingLocally = true;
      setDoc(docRef, { appData: d })
        .then(() => {
          setSyncStatus('ok');
          // 短い待機後にフラグ解除（自snapshotが届く猶予）
          setTimeout(() => { isSavingLocally = false; }, 2000);
        })
        .catch((e) => {
          console.warn('Firestore保存エラー:', e);
          setSyncStatus('offline');
          isSavingLocally = false;
        });
    };

  } catch(e) {
    console.error('Firebase初期化エラー:', e);
    const txt = document.getElementById('syncText');
    if (txt) txt.textContent = 'ローカルのみ';
  }
})();
