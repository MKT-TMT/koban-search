<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TIME TABLE MK-86</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:       #e8f7f9;
    --surface:  #ffffff;
    --surface2: #f0fafb;
    --border:   #b8e4ec;
    --border2:  #7ecfe0;
    --accent:   #0ea8d8;
    --accent2:  #3dbf7a;
    --green:    #2ecf7a;
    --amber:    #e08a10;
    --red:      #e03535;
    --sky:      #0ea8d8;
    --text:     #0d2a30;
    --muted:    #5a8a96;
    --card-shadow: 0 2px 10px rgba(14,168,216,.10);
    --mono: 'DM Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ══════════════ HEADER ══════════════ */
  .header {
    position: sticky; top:0; z-index:200;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 0 14px;
    display: flex; align-items: center; justify-content: space-between;
    height: 54px; gap: 10px;
    box-shadow: 0 2px 12px rgba(60,80,160,.07);
  }
  .logo {
    font-family: var(--mono); font-size: 16px; letter-spacing: 1.5px;
    color: var(--accent); font-weight: 500;
    display: flex; align-items: baseline; gap: 6px;
  }
  .logo-sub { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

  /* ══════════════ TAB BAR ══════════════ */
  .tab-bar {
    display: flex; gap: 2px;
    background: var(--surface2);
    border-radius: 10px; padding: 3px;
    border: 1px solid var(--border);
  }
  .tab {
    font-family: var(--sans); font-size: 16px; font-weight: 700;
    padding: 9px 18px; border-radius: 7px; cursor: pointer;
    border: none; background: transparent; color: var(--muted);
    transition: all .16s ease; letter-spacing: 0.3px;
  }
  .tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(14,168,216,.35); }
  .tab:hover:not(.active) { color: var(--text); background: var(--border); }

  /* ══════════════ NAV ROW ══════════════ */
  .nav-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px;
  }
  .nav-title { font-size: 19px; font-weight: 700; color: var(--text); }
  .nav-btns { display: flex; gap: 6px; }
  .nav-btn {
    height: 44px; border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: all .14s; user-select: none; padding: 0 14px;
    box-shadow: var(--card-shadow);
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); background: #e0f7fd; }
  .today-btn { font-size: 14px; font-family: var(--sans); font-weight: 700; letter-spacing: 0.4px; }

  /* ══════════════ MONTH VIEW ══════════════ */
  .month-grid { padding: 0 14px 20px; }
  .dow-row { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 6px; }
  .dow-cell {
    text-align: center; font-size: 11px; font-weight: 700;
    padding: 6px 0; color: var(--muted); letter-spacing: 0.8px;
  }
  .dow-cell.sat { color: var(--sky); }
  .dow-cell.sun { color: var(--red); }

  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-cell {
    background: var(--surface); border-radius: 9px; padding: 6px 5px 7px;
    min-height: 74px; cursor: pointer;
    border: 1.5px solid var(--border);
    transition: border-color .13s, box-shadow .13s;
    box-shadow: var(--card-shadow);
  }
  .cal-cell:hover { border-color: var(--accent); box-shadow: 0 3px 14px rgba(14,168,216,.18); }
  .cal-cell.other-month { opacity: .38; box-shadow: none; }
  .cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(14,168,216,.22); }
  .cal-cell.selected { border-color: var(--accent2); background: #e6faef; }

  .cal-date {
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    margin-bottom: 4px; color: var(--text);
  }
  .cal-cell.today .cal-date {
    background: var(--accent); color: #fff;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
    font-size: 11px;
  }
  .cal-cell.sat .cal-date { color: var(--sky); }
  .cal-cell.sun .cal-date { color: var(--red); }
  .cal-cell.today.sat .cal-date,
  .cal-cell.today.sun .cal-date { color: #fff; }

  .cal-shift {
    font-size: 13px; font-weight: 700; letter-spacing: 0.3px;
    padding: 2px 5px; border-radius: 4px; display: block;
    margin-bottom: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cal-shift.work    { background: #c8eef8; color: #0878a0; }
  .cal-shift.holiday { background: #ffd9d9; color: #c01010; }
  .cal-shift.off     { background: #ffd9d9; color: #c01010; }
  .cal-shift.paid    { background: #ffd9d9; color: #c01010; }
  .cal-shift.plan    { background: #ffe5b0; color: #a06000; border: 1px dashed #e0a030; }
  .cal-shift.task    { background: #d4f5e5; color: #0a5e2a; }
  .cal-shift.task2   { background: #d4f5e5; color: #0a5e2a; }
  .cal-shift.garage  { background: #d4f5e5; color: #0a5e2a; }
  .cal-shift.other   { background: #d4f5e5; color: #0a5e2a; }
  .cal-time { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .cal-koban-info { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px; }
  .cal-koban-badge {
    font-family: var(--mono); font-size: 9px; padding: 1px 5px;
    border-radius: 4px; background: #e0f7fd; color: #0878a0;
    border: 1px solid #b8e4ec; white-space: nowrap;
  }
  .cal-koban-badge.danger { background: #ffd9d9; color: #b00000; border-color: #f0b0b0; }
  .cal-koban-badge.span   { background: var(--surface2); color: var(--muted); border-color: var(--border); }
  .cal-koban-route { font-size: 9px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  /* IRODORI連携アイコン */
  .cal-irodori-icons { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
  .cal-irodori-icon  { font-size: 11px; line-height: 1; }
  .wt-irodori-icons  { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; margin-top: 3px; }
  .wt-irodori-icon   { font-size: 13px; line-height: 1; }

  /* ══════════════ WEEK VIEW ══════════════ */
  .week-view { padding: 0 0 24px; overflow-x: auto; }
  .week-table { min-width: 620px; width: 100%; border-collapse: collapse; }

  .wt-label {
    padding: 8px 12px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    color: var(--muted);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: nowrap; vertical-align: middle;
  }
  .wt-section-row td {
    background: #d4f2fa;
    padding: 5px 12px;
    font-size: 11px; font-weight: 800; letter-spacing: 1.2px;
    color: var(--accent); text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
  }

  .wt-day-header {
    text-align: center; padding: 10px 4px 8px;
    background: var(--surface2);
    border-bottom: 2px solid var(--border2);
    border-right: 1px solid var(--border);
    cursor: pointer; transition: background .13s; min-width: 86px;
  }
  .wt-day-header:hover { background: #d4f2fa; }
  .wt-day-header.today { background: #d4f2fa; border-bottom-color: var(--accent); border-left: 2.5px solid var(--accent); border-right: 2.5px solid var(--accent); }
  .wt-day-header.selected-col { background: #e6faef; border-bottom-color: var(--accent2); }
  .wt-dow { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--muted); }
  .wt-day-header.today .wt-dow   { color: var(--accent); }
  .wt-day-header.sat .wt-dow     { color: var(--sky); }
  .wt-day-header.sun .wt-dow     { color: var(--red); }
  .wt-date-num {
    font-family: var(--mono); font-size: 20px; font-weight: 600;
    margin-top: 1px; line-height: 1;
  }
  .wt-day-header.today .wt-date-num   { color: var(--accent); }
  .wt-day-header.sat .wt-date-num     { color: var(--sky); }
  .wt-day-header.sun .wt-date-num     { color: var(--red); }
  .wt-month-label { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .wt-cell {
    text-align: center; padding: 8px 5px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    font-family: var(--mono); font-size: 19px; font-weight: 700;
    vertical-align: middle; transition: background .1s; background: var(--surface);
  }
  .wt-cell:hover { background: #e0f7fd; }
  .wt-cell.today-col    { background: #d4f2fa; border-left: 2.5px solid var(--accent); border-right: 2.5px solid var(--accent); }
  .wt-cell.selected-col { background: #e6faef; }
  .wt-cell.empty        { background: var(--surface); }

  .wt-shift-badge {
    display: inline-block; padding: 5px 12px; border-radius: 7px;
    font-size: 19px; font-weight: 800; letter-spacing: 0.2px;
  }
  .wt-shift-badge.work    { background: #c8eef8; color: #0878a0; }
  .wt-shift-badge.holiday { background: #ffd9d9; color: #c01010; }
  .wt-shift-badge.off     { background: #ffd9d9; color: #c01010; }
  .wt-shift-badge.paid    { background: #ffd9d9; color: #c01010; }
  .wt-shift-badge.plan    { background: #ffe5b0; color: #a06000; border: 1px dashed #e0a030; }

  .wt-summary-badge {
    display: inline-block; padding: 4px 10px; border-radius: 6px;
    font-size: 16px; font-weight: 700; font-family: var(--mono); letter-spacing: 0.2px;
  }
  .wt-summary-badge.ok   { background: #c8f5e2; color: #0a6e3e; }
  .wt-summary-badge.warn { background: #fff3cc; color: #8a5c00; }
  .wt-summary-badge.bad  { background: #ffd9d9; color: #b00000; }

  /* ══════════════ MONTH/WEEK LIST VIEW ══════════════ */
  .wvl-day-block {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; margin-bottom: 6px;
    box-shadow: 0 2px 10px rgba(14,168,216,.08);
    overflow: hidden; cursor: pointer; transition: border-color .13s, box-shadow .13s;
  }
  .wvl-day-block:hover { border-color: var(--border2); box-shadow: 0 3px 14px rgba(14,168,216,.18); }
  .wvl-date-cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 4px; border-right: 1px solid var(--border);
    background: var(--surface2); gap: 3px;
  }
  .wvl-dow { font-size: 15px; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; }
  .wvl-dow.sat { color: var(--sky); }
  .wvl-dow.sun { color: var(--red); }
  .wvl-daynum { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1.1; font-family: var(--mono); }
  .wvl-daynum.sat { color: var(--sky); }
  .wvl-daynum.sun { color: var(--red); }
  .wvl-daynum.today-circle {
    background: var(--accent); color: #fff; border-radius: 50%;
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 2px 8px rgba(14,168,216,.35);
  }
  .wvl-row1 { display: flex; align-items: center; padding: 8px 12px; gap: 10px; flex-wrap: wrap; }
  .wvl-row2 { display: flex; align-items: center; padding: 7px 12px; gap: 10px; flex-wrap: wrap; background: var(--surface2); border-top: 1px dashed var(--border); }
  .wvl-badge { font-size: 16px; font-weight: 700; padding: 4px 11px; border-radius: 5px; white-space: nowrap; }
  .wvl-badge.b-work { background: #c8eef8; color: #0878a0; }
  .wvl-badge.b-off  { background: #ffd9d9; color: #c01010; }
  .wvl-badge.b-plan { background: #ffe5b0; color: #a06000; border: 1px dashed #e0a030; }
  .wvl-badge.b-task { background: #d4f5e5; color: #0a5e2a; }
  .wvl-timerange { font-size: 16px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
  .wvl-sep { font-size: 14px; color: var(--border2); }
  .wvl-metric-group { display: flex; align-items: center; gap: 5px; }
  .wvl-lbl { font-size: 14px; color: var(--muted); white-space: nowrap; font-weight: 500; }
  .wvl-metric { font-size: 15px; padding: 3px 9px; border-radius: 5px; white-space: nowrap; font-family: var(--mono); font-weight: 700; }
  .wvl-metric.m-ok   { background: #d4f5e5; color: #0a5e2a; }
  .wvl-metric.m-warn { background: #fff4df; color: #a06000; border: 1px solid #e0a030; }
  .wvl-metric.m-bad  { background: #ffd9d9; color: #c01010; }
  .wvl-metric.m-none { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .wvl-life { font-size: 15px; color: var(--text); white-space: nowrap; display: flex; align-items: center; gap: 3px; font-family: var(--mono); }
  .wvl-life-icon { font-size: 16px; }
  .wvl-irodori { font-size: 17px; }
  .wvl-none { font-size: 14px; color: var(--muted); }

  /* ══════════════ DAY VIEW ══════════════ */
  .day-view { padding: 0 16px 40px; max-width: 620px; margin: 0 auto; }

  .day-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; margin-bottom: 12px; overflow: visible;
    box-shadow: var(--card-shadow);
  }
  .day-card-header {
    padding: 12px 16px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    display: flex; align-items: center; gap: 10px;
  }
  .day-card-icon { font-size: 19px; }
  .day-card-title { font-size: 28px; font-weight: 700; color: var(--text); }
  .day-card-sub { font-size: 24px; color: var(--muted); margin-left: auto; font-family: var(--mono); font-weight: 600; }
  .day-card-body { padding: 14px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .life-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .life-row:last-child { border-bottom: none; }
  .life-label { font-size: 16px; color: var(--muted); }

  .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .stat-box {
    background: var(--surface2); border-radius: 10px; padding: 10px 12px;
    border: 1px solid var(--border); text-align: center;
  }
  .stat-label { font-size: 18px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .stat-val { font-family: var(--mono); font-size: 32px; font-weight: 700; color: var(--text); }
  .stat-val.good { color: var(--green); }
  .stat-val.warn { color: var(--amber); }
  .stat-val.bad  { color: var(--red); }

  /* ══════════════ INPUT VIEW ══════════════ */
  .input-view { padding: 0 16px 40px; max-width: 620px; margin: 0 auto; }

  /* date selector strip */
  .date-selector {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0 4px;
  }
  .date-selector-label { font-size: 14px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .date-input-native {
    flex: 1; background: var(--surface); border: 1.5px solid var(--border2);
    border-radius: 9px; padding: 8px 12px; color: var(--text);
    font-family: var(--mono); font-size: 16px; font-weight: 500; outline: none;
    box-shadow: var(--card-shadow); transition: border-color .14s;
  }
  .date-input-native:focus { border-color: var(--accent); }

  /* shift section in input */
  .inp-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; margin-bottom: 12px; overflow: visible;
    box-shadow: var(--card-shadow);
  }
  .inp-card-header {
    padding: 11px 16px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    font-size: 16px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .inp-card-body { padding: 14px 16px; }

  /* special shift buttons */
  .special-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .special-btn {
    padding: 12px 18px; border-radius: 10px; cursor: pointer;
    font-size: 16px; font-weight: 700; border: 1.5px solid var(--border2);
    background: var(--surface2); color: var(--muted);
    transition: all .14s;
  }
  .special-btn:hover { border-color: var(--accent); color: var(--accent); background: #d4f2fa; }
  .special-btn.sel-holiday  { background: #d4f5e5; color: #0a7a3e; border-color: #18b86a; }
  .special-btn.sel-sub      { background: #ffefd4; color: #965800; border-color: #e08a10; }
  .special-btn.sel-paid     { background: #ffd9d9; color: #a01010; border-color: #e03535; }
  .special-btn.sel-plan     { background: #ffe5b0; color: #a06000; border: 1.5px dashed #e0a030; font-weight: 700; }
  .special-btn.sel-off      { background: #ebebeb; color: #555; border-color: #aaa; }
  .special-btn.sel-compound { background: #fff0e0; color: #e07a00; border-color: #f5a623; }
  /* 複合業務オレンジ系 */
  .compound-panel { border: 2px solid #f5a623; border-radius: 14px; padding: 14px; margin-top: 10px; background: #fff; }
  .compound-header { font-size: 12px; font-weight: 800; color: #e07a00; letter-spacing: 1px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .compound-badge-tag { font-size: 11px; background: #f5a623; color: #fff; border-radius: 20px; padding: 2px 10px; font-weight: 800; }
  .compound-code-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .compound-code-inp { font-family: var(--mono); font-size: 26px; font-weight: 900; color: #0878a0; background: #c8eef8; border: 2px solid #4ab8d8; border-radius: 10px; padding: 7px 10px; text-align: center; width: 88px; flex-shrink: 0; outline: none; }
  .compound-mode-btns { display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .compound-mode-btn { font-size: 14px; font-weight: 700; padding: 10px 0; border-radius: 9px; border: none; cursor: pointer; text-align: center; transition: background 0.15s; }
  .compound-mode-btn.all-btn  { background: #4ab8d8; color: #fff; }
  .compound-mode-btn.part-btn { background: #fff; color: #4ab8d8; border: 2px solid #4ab8d8; }
  .compound-mode-btn.part-btn.active { background: #f5a623; color: #fff; border-color: #f5a623; }
  .compound-trip-panel { border: 1.5px solid #c5eaf5; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .compound-trip-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 0.5px solid #e8f4fb; cursor: pointer; }
  .compound-trip-item:last-child { border-bottom: none; }
  .compound-trip-item.selected { background: #fff8f0; }
  .compound-trip-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #4ab8d8; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; color: transparent; }
  .compound-trip-check.on { background: #4ab8d8; color: #fff; border-color: #4ab8d8; }
  .compound-trip-no { font-family: var(--mono); font-size: 13px; font-weight: 700; color: #0878a0; min-width: 58px; }
  .compound-trip-detail { font-size: 11px; color: #555; line-height: 1.5; flex: 1; }
  .compound-trip-time { font-size: 11px; color: #4ab8d8; font-weight: 700; }
  .compound-decide-btn { width: 100%; font-size: 16px; font-weight: 700; padding: 12px; border-radius: 10px; border: none; background: #f5a623; color: #fff; cursor: pointer; margin-top: 8px; }
  .compound-added-card { background: #fff; border: 1.5px solid #ffd4a0; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .compound-added-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff8f0; border-bottom: 0.5px solid #ffd4a0; }
  .compound-added-code { font-family: var(--mono); font-size: 16px; font-weight: 900; color: #0878a0; background: #c8eef8; border-radius: 6px; padding: 3px 10px; }
  .compound-added-mode { font-size: 11px; font-weight: 700; }
  .compound-added-mode.all { color: #4ab8d8; }
  .compound-added-mode.part { color: #f5a623; }
  .compound-added-time { font-size: 12px; font-weight: 700; color: #555; margin-left: auto; }
  .compound-added-del { color: var(--red); background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 700; margin-left: 6px; }
  .compound-added-body { padding: 6px 12px; font-family: var(--mono); font-size: 11px; color: #555; line-height: 1.8; }
  .special-btn.sel-training { background: #fff0d4; color: #8a4a00; border-color: #e07a00; }

  /* 複合業務パネル */
  .compound-panel {
    margin-top: 12px; padding: 12px 14px;
    background: #f8f4ff; border: 1.5px solid #c4a0ff;
    border-radius: 12px;
  }
  .compound-search-row {
    display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
  }
  .compound-search {
    flex: 1; background: var(--surface); border: 1.5px solid #c4a0ff;
    border-radius: 8px; padding: 8px 12px; color: var(--text);
    font-family: var(--mono); font-size: 13px; outline: none;
    transition: border-color .14s;
  }
  .compound-search:focus { border-color: #9b4dff; }
  .compound-shift-list {
    max-height: 160px; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(76px,1fr)); gap: 5px;
    margin-bottom: 10px;
  }
  .compound-koban-badge {
    font-family: var(--mono); font-size: 13px; padding: 7px 8px; border-radius: 7px;
    cursor: pointer; border: 1.5px solid #c4a0ff; background: var(--surface2);
    color: #6200cc; transition: all .12s; text-align: center; font-weight: 500;
  }
  .compound-koban-badge:hover { border-color: #9b4dff; background: #ede0ff; }
  /* 複数選択：色分け3色 */
  .compound-koban-badge.sel-0 { background: #0ea8d8; color: #fff; border-color: #0ea8d8; }
  .compound-koban-badge.sel-1 { background: #3dbf7a; color: #fff; border-color: #2aaa65; }
  .compound-koban-badge.sel-2 { background: #e08a10; color: #fff; border-color: #c07000; }
  .compound-koban-badge.sel-3 { background: #9b4dff; color: #fff; border-color: #7a2ee0; }
  .compound-koban-badge.sel-4 { background: #e03535; color: #fff; border-color: #c01010; }

  /* 路線ブロック（交番ごとに色分け展開） */
  .compound-route-block {
    border-radius: 10px; margin-bottom: 8px; overflow: hidden; border: 1.5px solid;
  }
  .compound-route-block-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; font-size: 13px; font-weight: 700;
  }
  .compound-route-block .all-sel-btn {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 6px;
    border: 1.5px solid; cursor: pointer; background: var(--surface);
    font-family: var(--sans);
  }
  .compound-route-block.color-0 { border-color: #0ea8d8; }
  .compound-route-block.color-0 .compound-route-block-head { background: #d4f2fa; color: #0878a0; }
  .compound-route-block.color-0 .all-sel-btn { border-color: #0ea8d8; color: #0ea8d8; }
  .compound-route-block.color-1 { border-color: #3dbf7a; }
  .compound-route-block.color-1 .compound-route-block-head { background: #d4f5e5; color: #0a7a3e; }
  .compound-route-block.color-1 .all-sel-btn { border-color: #3dbf7a; color: #3dbf7a; }
  .compound-route-block.color-2 { border-color: #e08a10; }
  .compound-route-block.color-2 .compound-route-block-head { background: #ffefd4; color: #965800; }
  .compound-route-block.color-2 .all-sel-btn { border-color: #e08a10; color: #e08a10; }
  .compound-route-block.color-3 { border-color: #9b4dff; }
  .compound-route-block.color-3 .compound-route-block-head { background: #ede0ff; color: #6200cc; }
  .compound-route-block.color-3 .all-sel-btn { border-color: #9b4dff; color: #9b4dff; }
  .compound-route-block.color-4 { border-color: #e03535; }
  .compound-route-block.color-4 .compound-route-block-head { background: #ffd9d9; color: #a01010; }
  .compound-route-block.color-4 .all-sel-btn { border-color: #e03535; color: #e03535; }

  /* 全部/一部トグルボタン */
  .koban-mode-toggle {
    display: flex; border-radius: 6px; overflow: hidden;
    border: 1.5px solid; flex-shrink: 0;
  }
  .koban-mode-toggle button {
    padding: 3px 9px; border: none; font-size: 11px; font-weight: 700;
    cursor: pointer; font-family: var(--sans); background: var(--surface);
    color: var(--muted); transition: all .12s;
  }
  /* 全部モード時の「全路線」メッセージ */
  .compound-all-msg {
    padding: 8px 12px; background: var(--surface2);
    font-size: 13px; color: var(--muted); text-align: center;
    font-family: var(--mono);
  }

  /* 路線チェックリスト行 */
  .compound-route-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-top: 1px solid #e8e8e8; font-size: 14px;
    background: var(--surface);
  }
  .compound-route-item input[type=checkbox] {
    width: 16px; height: 16px; flex-shrink: 0;
  }
  .compound-route-label { flex: 1; font-family: var(--mono); color: var(--text); }
  .compound-route-time { color: var(--muted); font-size: 13px; white-space: nowrap; }

  /* 選択済みサマリ */
  .compound-selected-summary {
    margin-top: 10px; padding: 9px 13px;
    background: #9b4dff; border-radius: 9px; color: #fff;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.8;
  }
  .compound-selected-summary.empty { background: var(--border); color: var(--muted); }
  .compound-sum-chip {
    border-radius: 5px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .compound-sum-chip-0 { background: #0ea8d8; color: #fff; }
  .compound-sum-chip-1 { background: #3dbf7a; color: #fff; }
  .compound-sum-chip-2 { background: #e08a10; color: #fff; }
  .compound-sum-chip-3 { background: #9b4dff; color: #fff; }
  .compound-sum-chip-4 { background: #e03535; color: #fff; }
  .compound-sum-chip-task { background: #2ecf7a; color: #fff; }

  /* ══ 作業内容セクション（黄緑基調） ══ */
  .task-content-section {
    background: #f0faf2; border: 1.5px solid #6ecf8a;
    border-radius: 12px; padding: 11px 12px; margin-bottom: 12px;
  }
  .task-content-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px;
  }
  .task-content-title { font-size: 12px; font-weight: 800; color: #1a7a3e; letter-spacing: 0.8px; }
  .task-content-add-btn {
    font-size: 12px; font-weight: 700; color: #2ecf7a;
    background: var(--surface); border: 1.5px solid #2ecf7a;
    border-radius: 7px; padding: 4px 12px; cursor: pointer; font-family: var(--sans);
  }
  .task-content-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1.5px solid #8ee0b8;
    border-radius: 9px; padding: 9px 11px; margin-bottom: 6px;
  }
  .task-content-name { font-size: 14px; font-weight: 700; color: #0a5e2a; flex: 1; }
  .task-content-time {
    font-family: var(--mono); font-size: 13px; color: #1a7a3e;
    background: #c8f5e2; border-radius: 6px; padding: 2px 8px; white-space: nowrap;
  }
  .task-content-del {
    font-size: 14px; color: #8ee0b8; flex-shrink: 0; padding-left: 4px;
    cursor: pointer; background: none; border: none; font-family: var(--sans);
  }
  .task-content-form {
    background: var(--surface); border: 1.5px dashed #2ecf7a;
    border-radius: 10px; padding: 11px; margin-bottom: 6px;
  }
  .task-content-form-title {
    font-size: 10px; font-weight: 800; color: #1a7a3e; letter-spacing: 1px; margin-bottom: 8px;
  }
  .task-content-type-btns { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .task-content-type-btn {
    font-size: 12px; font-weight: 700; padding: 5px 12px;
    border-radius: 7px; border: 1.5px solid #8ee0b8;
    background: #e8faf2; color: #1a7a3e; cursor: pointer; font-family: var(--sans);
    transition: all .12s;
  }
  .task-content-type-btn.active { background: #2ecf7a; color: #fff; border-color: #2ecf7a; }
  .task-content-custom-inp {
    width: 100%; background: #f0faf2; border: 1.5px solid #8ee0b8;
    border-radius: 7px; padding: 7px 10px; font-size: 13px; color: #1a7a3e;
    margin-bottom: 8px; outline: none; font-family: var(--sans); box-sizing: border-box;
  }
  .task-content-time-row { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
  .task-content-form-label { font-size: 12px; color: #1a7a3e; white-space: nowrap; font-weight: 700; }
  .task-content-time-inp {
    flex: 1; background: #f0faf2; border: 1.5px solid #8ee0b8;
    border-radius: 7px; padding: 7px 8px;
    font-family: var(--mono); font-size: 16px; color: #1a7a3e;
    text-align: center; font-weight: 700; outline: none;
  }
  .task-content-reg-btn {
    background: #2ecf7a; color: #fff; border: none;
    border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 700;
    width: 100%; cursor: pointer; font-family: var(--sans);
  }

  /* 業務習得パネル（単独シフト用・旧来） */
  .training-panel {
    margin-top: 12px; padding: 12px 14px;
    background: #f0faf2; border: 1.5px solid #6ecf8a;
    border-radius: 12px;
  }

  /* shift search + grid */
  .shift-search {
    width: 100%; background: var(--surface2); border: 1.5px solid var(--border2);
    border-radius: 9px; padding: 9px 12px; color: var(--text);
    font-family: var(--mono); font-size: 16px; outline: none; margin-bottom: 10px;
    transition: border-color .14s; box-shadow: var(--card-shadow);
  }
  .shift-search:focus { border-color: var(--accent); }
  .shift-search::placeholder { color: var(--muted); }
  .shift-list {
    max-height: 220px; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 5px;
  }
  .shift-list::-webkit-scrollbar { width: 4px; }
  .shift-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .shift-badge {
    font-family: var(--mono); font-size: 13px; padding: 8px 8px; border-radius: 7px;
    cursor: pointer; border: 1.5px solid var(--border); background: var(--surface2);
    color: var(--muted); transition: all .12s; text-align: center; font-weight: 500;
  }
  .shift-badge:hover { border-color: var(--accent); color: var(--accent); background: #d4f2fa; }
  .shift-badge.selected { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(14,168,216,.3); }

  /* custom shift */
  .custom-row {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding-top: 10px; border-top: 1px solid var(--border); margin-top: 10px;
  }
  .custom-row input {
    background: var(--surface2); border: 1.5px solid var(--border2);
    border-radius: 8px; padding: 7px 10px; color: var(--text);
    font-family: var(--mono); font-size: 12px; outline: none;
    transition: border-color .14s;
  }
  .custom-row input:focus { border-color: var(--accent); }
  .custom-name-inp { flex: 1; min-width: 80px; }
  .custom-time-inp { width: 100px; }
  .btn-register {
    padding: 8px 16px; background: var(--accent); border: none;
    border-radius: 8px; color: #fff; font-size: 12px; cursor: pointer;
    font-family: var(--sans); font-weight: 700; transition: opacity .14s;
    box-shadow: 0 2px 8px rgba(14,168,216,.3);
  }
  .btn-register:hover { opacity: .88; }

  /* life input rows */
  .inp-life-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .inp-life-row:last-child { border-bottom: none; }
  .inp-life-label { font-size: 16px; color: var(--muted); }
  .inp-life-time {
    background: var(--surface2); border: 1.5px solid var(--border2);
    border-radius: 8px; padding: 6px 12px;
    color: var(--text); font-family: var(--mono); font-size: 26px; font-weight: 700;
    outline: none; width: 160px; transition: border-color .14s;
    box-shadow: var(--card-shadow);
  }
  .inp-life-time:focus { border-color: var(--accent); }

  /* sleep day toggle */
  .sleep-day-toggle {
    display: flex; border-radius: 7px; overflow: hidden;
    border: 1.5px solid var(--border2); background: var(--surface2);
    font-size: 11px; font-weight: 700; font-family: var(--sans);
    flex-shrink: 0;
  }
  .sleep-day-toggle button {
    padding: 5px 10px; border: none; background: transparent;
    color: var(--muted); cursor: pointer; transition: all .14s;
    white-space: nowrap; line-height: 1;
  }
  .sleep-day-toggle button.active {
    background: var(--accent); color: #fff;
  }
  .inp-life-row-sleep {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
    gap: 8px; flex-wrap: wrap;
  }
  .inp-life-row-sleep .inp-life-label { font-size: 13px; color: var(--muted); flex-shrink: 0; }

  /* interval input section */
  .inp-interval-section {
    background: #e8faf2; border: 1.5px solid #8ee0b8;
    border-radius: 14px; margin-bottom: 12px; overflow: hidden;
    box-shadow: var(--card-shadow);
  }
  .inp-interval-header {
    padding: 11px 16px; background: #c6f2de;
    border-bottom: 1px solid #8ee0b8;
    font-size: 16px; font-weight: 700; color: #0a6e3e;
    display: flex; align-items: center; gap: 8px;
  }
  .inp-interval-body { padding: 14px 16px; }
  .inp-interval-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid #b8e8d2;
  }
  .inp-interval-row:last-child { border-bottom: none; }
  .inp-interval-label { font-size: 14px; color: #1a7a50; font-weight: 600; flex: 1; }
  .inp-interval-right { display: flex; align-items: center; gap: 8px; }
  .inp-interval-minutes {
    background: var(--surface); border: 1.5px solid #8ee0b8;
    border-radius: 8px; padding: 6px 10px;
    color: var(--text); font-family: var(--mono); font-size: 16px; font-weight: 500;
    outline: none; width: 88px; text-align: center; transition: border-color .14s;
    box-shadow: var(--card-shadow);
  }
  .inp-interval-minutes:focus { border-color: var(--accent2); }
  .inp-interval-display {
    font-family: var(--mono); font-size: 16px; font-weight: 700;
    color: #0a6e3e; min-width: 56px; text-align: right;
  }

  /* モーダル */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 900;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(3px);
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--surface); border-radius: 18px; padding: 24px;
    width: min(92vw, 520px); box-shadow: 0 8px 40px rgba(0,0,0,.22);
    border: 1.5px solid var(--border2);
  }
  .modal-title {
    font-size: 16px; font-weight: 800; color: var(--text);
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
  }
  .modal-desc {
    font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.7;
  }
  .modal-textarea {
    width: 100%; height: 160px; border: 1.5px solid var(--border2);
    border-radius: 10px; padding: 10px 12px; font-family: var(--mono);
    font-size: 11px; color: var(--text); background: var(--surface2);
    resize: vertical; outline: none; box-sizing: border-box;
  }
  .modal-textarea:focus { border-color: var(--accent); }
  .modal-btns {
    display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap;
  }
  .modal-btn {
    padding: 9px 20px; border-radius: 9px; border: none; font-size: 13px;
    font-weight: 700; font-family: var(--sans); cursor: pointer; transition: all .14s;
  }
  .modal-btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(14,168,216,.3); }
  .modal-btn-primary:hover { opacity: .88; }
  .modal-btn-green { background: #2ecf7a; color: #fff; box-shadow: 0 2px 8px rgba(46,207,122,.3); }
  .modal-btn-green:hover { opacity: .88; }
  .modal-btn-cancel { background: var(--surface2); color: var(--muted); border: 1.5px solid var(--border2); }
  .modal-btn-cancel:hover { color: var(--text); }

  /* ══════════════ SECTION LABEL ══════════════ */
  .section-label {
    font-size: 18px; font-weight: 800; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase;
    padding: 0 2px; margin-bottom: 8px; margin-top: 18px;
  }

  /* ══════════════ NEW KOBAN BUTTON ══════════════ */
  .data-btn-new-koban {
    background: linear-gradient(135deg, #ff8c00, #e05a00);
    color: #fff !important;
    border: none !important;
    box-shadow: 0 2px 8px rgba(224,90,0,.35);
  }
  .data-btn-new-koban:hover { opacity: .88; }

  /* ══════════════ REVERSE CALC SECTION ══════════════ */
  .calc-section {
    background: var(--surface); border-radius: 14px;
    border: 1.5px solid #b8e08a;
    overflow: hidden; margin-bottom: 20px;
  }
  .calc-header {
    background: #edfad0;
    font-size: 14px; font-weight: 800; color: #3a6e10;
    padding: 10px 16px; letter-spacing: 0.5px;
    border-bottom: 1px solid #b8e08a;
  }
  .calc-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .calc-row {
    display: flex; align-items: center; gap: 8px;
  }
  .calc-label {
    font-size: 14px; font-weight: 700; color: var(--text);
    min-width: 120px; flex-shrink: 0;
  }
  .calc-sel {
    flex: 1; padding: 7px 8px;
    border: 1.5px solid #b8e08a; border-radius: 8px;
    background: #edfad0; color: #3a6e10;
    font-size: 16px; font-family: var(--mono); font-weight: 700;
    outline: none; cursor: pointer;
    transition: border-color .14s;
  }
  .calc-sel:focus { border-color: #7ab830; }
  .calc-sel-wide { max-width: 130px; }
  .calc-sel-s    { max-width: 80px; }
  .calc-unit { font-size: 13px; color: #5a9e1a; flex-shrink: 0; font-weight: 700; }
  .calc-divider {
    font-size: 12px; font-weight: 800; color: var(--muted);
    letter-spacing: 1px; padding: 4px 0 2px; margin-top: 4px;
  }

  /* 生活時刻＋逆算 2列レイアウト */
  .life-calc-card {
    background: var(--surface); border: 1.5px solid #b8e08a;
    border-radius: 14px; overflow: hidden; margin-bottom: 12px;
  }
  .life-calc-header {
    background: #edfad0; padding: 10px 14px;
    font-size: 12px; font-weight: 800; color: #3a6e10;
    border-bottom: 1.5px solid #b8e08a; letter-spacing: 0.5px;
    display: flex; gap: 0;
  }
  .life-calc-col-hd {
    flex: 1; font-size: 16px; font-weight: 800; letter-spacing: 1px;
    text-align: center; padding: 8px 0;
  }
  .life-calc-col-hd.left  { color: var(--muted); border-right: 1px solid #b8e08a; }
  .life-calc-col-hd.right { color: #3a6e10; }
  .life-calc-grid {
    display: grid; grid-template-columns: 1fr 1fr;
  }
  .life-calc-left  { border-right: 1px solid #b8e08a; }
  .life-calc-right { background: #fff; }
  .lc-row {
    display: flex; flex-direction: column; justify-content: center;
    padding: 12px 14px; border-bottom: 1px solid #d8efc0; min-height: 80px;
  }
  .lc-row:last-child { border-bottom: none; }
  .lc-label { font-size: 20px; color: var(--muted); margin-bottom: 6px; }
  .lc-inp {
    font-family: var(--mono); font-size: 26px; font-weight: 700;
    border: 1.5px solid #b8e08a; border-radius: 8px;
    padding: 6px 10px; color: var(--text); background: var(--surface);
    outline: none; width: 100%;
  }
  .lc-inp:focus { border-color: #7ab830; }
  .lc-calc-row {
    display: flex; flex-direction: column; justify-content: center; gap: 6px;
    padding: 12px 14px; border-bottom: 1px solid #d8efc0; min-height: 80px;
    background: #fff;
  }
  .lc-calc-row:last-child { border-bottom: none; }

<script>
// ══════════════════════════════════════════
// SHIFT DATA
// ══════════════════════════════════════════


// ══════════════════════════════════════════
// KOBAN VIEWER DATA (from koban_viewer.html)
// ══════════════════════════════════════════
// 交番番号から曜日区分の路線データを検索する関数
// NEW_DATA / CUR_DATA は koban_viewer と同一形式で下部に定義
function getKobanDetail(shiftLabel, dateKey) {
  if (!shiftLabel || !shiftLabel.includes('交番')) return null;
  const num = parseInt(shiftLabel.replace('交番','').trim(), 10);
  if (isNaN(num)) return null;
  const d = new Date(dateKey);
  const dow = d.getDay(); // 0=日,6=土
  let shu;
  if (dow === 6) shu = '土曜';
  else if (dow === 0) shu = '日祝';
  else shu = '平日';

  const db = KV_NEW_DATA;
  const key = `${shu}_${num}`;
  return db[key] || null;
}

// ══════════════════════════════════════════
// KOBAN DATA EDIT (localStorage差分管理)
// ══════════════════════════════════════════
const KOBAN_EDIT_KEY = 'mkx_koban_edit_v1';
function loadKobanEdits() {
  try { return JSON.parse(localStorage.getItem(KOBAN_EDIT_KEY) || '{}'); } catch { return {}; }
}
function saveKobanEdits(d) { localStorage.setItem(KOBAN_EDIT_KEY, JSON.stringify(d)); }

// 差分適用済みのルート一覧を返す
// key例: "new:平日_14" or "cur:平日_14"
function getEffectiveRoutes(dbType, shu, koban) {
  const dataKey = `${dbType}:${shu}_${koban}`;
  const edits = loadKobanEdits();
  const base = KV_NEW_DATA;
  const baseEntry = base[`${shu}_${koban}`];
  const baseRoutes = baseEntry ? JSON.parse(JSON.stringify(baseEntry.routes)) : [];
  const diff = edits[dataKey] || {};
  // diff.routes: { [no]: routeObj | null(削除) }
  if (!diff.routes) return { routes: baseRoutes, isModified: false };
  let result = baseRoutes.filter(r => diff.routes[r.no] !== null);
  result = result.map(r => diff.routes[r.no] ? {...r, ...diff.routes[r.no]} : r);
  // 新規追加（baseにないno）
  Object.entries(diff.routes).forEach(([no, route]) => {
    if (route !== null && !baseRoutes.find(r => r.no === no)) result.push(route);
  });
  result.sort((a,b) => (a.dep_time||'').localeCompare(b.dep_time||''));
  return { routes: result, isModified: true };
}

// ── ラッシュ時間帯判定（朝7:00-9:00 / 夕17:00-19:00）──
function isRushTime(timeStr) {
  if (!timeStr) return { rush: false, label: '' };
  const parts = timeStr.split(':').map(Number);
  const min = parts[0] * 60 + parts[1];
  if (min >= 7*60 && min < 9*60)  return { rush: true, label: '朝R' };
  if (min >= 17*60 && min < 19*60) return { rush: true, label: '夕R' };
  return { rush: false, label: '' };
}

// ── 路線テーブル描画（折返しバッジ・ハイライト共通） ──
function buildRouteTable(routes) {
  const SPECIAL = /栄|名古屋駅|金山/;
  // ハイライト対象インデックスを計算
  const highlighted = new Set();
  routes.forEach((r, i) => {
    const isSpecial = SPECIAL.test(r.dep_place) || SPECIAL.test(r.arr_place);
    const isLong = r.ride_min >= 60;
    const nextInterval = (i + 1 < routes.length) ? routes[i+1].interval : null;
    if ((isSpecial || isLong) && nextInterval !== null && nextInterval < 10) {
      highlighted.add(i);
      highlighted.add(i + 1);
    }
  });

  const rows = routes.map((r, i) => {
    const barW = Math.min(100, Math.round(Math.min(r.ride_min, 80) / 80 * 100));
    const depRush = isRushTime(r.dep_time);
    const arrRush = isRushTime(r.arr_time);
    const isRush  = depRush.rush || arrRush.rush;

    // 発時・着時カラー＆ラッシュバッジ
    const depColor  = depRush.rush ? '#A32D2D' : 'var(--accent)';
    const arrColor  = arrRush.rush ? '#A32D2D' : 'var(--accent)';
    const depBadge  = depRush.rush ? `<span style="background:#FCEBEB;color:#A32D2D;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:500;margin-left:3px;vertical-align:middle">${depRush.label}</span>` : '';
    const arrBadge  = arrRush.rush ? `<span style="background:#FCEBEB;color:#A32D2D;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:500;margin-left:3px;vertical-align:middle">${arrRush.label}</span>` : '';

    // 乗務バー・乗務時間カラー
    const barColor  = isRush ? '#A32D2D' : 'var(--accent)';
    const rideColor = isRush ? '#A32D2D' : 'var(--muted)';
    const rideFW    = isRush ? 'font-weight:500;' : '';

    let intHtml = '';
    if (r.interval !== null && i > 0) {
      if (r.interval < 10) {
        intHtml = `<span style="background:#FCEBEB;color:#A32D2D;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:500;margin-left:3px">折返 ${r.interval}分</span>`;
      } else if (r.interval < 20) {
        intHtml = `<span style="background:#FAEEDA;color:#633806;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:500;margin-left:3px">折返 ${r.interval}分</span>`;
      } else {
        intHtml = `<span style="color:var(--muted);font-size:11px;margin-left:3px">折返 ${r.interval}分</span>`;
      }
    }
    const hlStyle = highlighted.has(i) ? 'background:#FBEAF0;' : '';
    return `<tr style="${hlStyle}border-bottom:1px solid var(--border)">
      <td style="font-family:var(--mono);font-size:13px;color:var(--muted);padding:8px 6px 8px 0;white-space:nowrap">${r.no}</td>
      <td style="font-size:13px;padding:8px 4px;white-space:nowrap">${r.dep_place}</td>
      <td style="font-family:var(--mono);font-size:13px;color:${depColor};padding:8px 4px;white-space:nowrap">${r.dep_time}${depBadge}</td>
      <td style="font-size:13px;padding:8px 4px;white-space:nowrap">${r.arr_place}</td>
      <td style="font-family:var(--mono);font-size:13px;color:${arrColor};padding:8px 4px;white-space:nowrap">${r.arr_time}${arrBadge}</td>
      <td style="padding:8px 0 8px 4px;min-width:80px">
        <div style="background:#e8f7f9;border-radius:4px;height:7px">
          <div style="background:${barColor};height:7px;border-radius:4px;width:${barW}%;min-width:3px"></div>
        </div>
        <div style="font-size:11px;color:${rideColor};${rideFW}margin-top:2px">${r.ride_min}分${intHtml}</div>
      </td>
    </tr>`;
  }).join('');
  return `<div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:2px solid var(--border)">
        <th style="padding:5px 6px 5px 0;color:var(--muted);font-weight:600;text-align:left">路線</th>
        <th style="padding:5px;color:var(--muted);font-weight:600;text-align:left">出発</th>
        <th style="padding:5px;color:var(--muted);font-weight:600;text-align:left">発時</th>
        <th style="padding:5px;color:var(--muted);font-weight:600;text-align:left">到着</th>
        <th style="padding:5px;color:var(--muted);font-weight:600;text-align:left">着時</th>
        <th style="padding:5px 0 5px 4px;color:var(--muted);font-weight:600;text-align:left">乗務</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── 新交番テーブル（施行日以降に自動切替）──
// 001-055=平日, 401-455=土曜, 201-255=日祝（MK-19の誤分類を修正済み）
const NEW_SHIFT_TABLE = {

let statsPeriod = 'month'; // 'month' | 'year'

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getWeekStart(d) {
  const day = d.getDay();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
}
function parseTime(s) {
  if (!s) return null;
  const parts = s.split(':').map(Number);
  return parts[0] * 60 + (parts[1] || 0);
}
function diffMin(a, b) {
  let d = b - a;
  if (d < 0) d += 1440;
  return d;
}
function fmtMin(m) {
  if (m === null || m === undefined || isNaN(m)) return '--:--';
  return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
}

function getShiftInfo(dateKey) {
  const rec = appData[dateKey];
  if (!rec || !rec.shift) return null;
  if (rec.shift === 'custom') return { label: rec.customLabel || 'カスタム', start: rec.customStart, end: rec.customEnd, type: 'work' };
  if (rec.shift === 'compound') {
    const tasks  = rec.taskContents  || [];
    const modes  = rec.compoundKobanModes || {};
    const kobans = rec.compoundKobans || [];
    const partialData = rec.compoundPartialData || {};
    let allTimes = tasks.map(t => t.start).concat(tasks.map(t => t.end)).filter(Boolean);
    // 全部モードはシフトテーブルの start/end、一部モードは手入力データを使用
    kobans.forEach(n => {
      if (modes[n] === 'all') {
        const tbl = getEffectiveShiftTable(dateKey);
        const s = tbl[String(n).padStart(3,'0') + '交番'];
        if (s) { allTimes.push(s.start); allTimes.push(s.end); }
      } else {
        const pd = partialData[n] || {};
        if (pd.start) allTimes.push(pd.start);
        if (pd.end) allTimes.push(pd.end);
      }
    });
    const start = rec.compoundManualStart || (allTimes.length ? allTimes.reduce((a,b) => a < b ? a : b) : null);
    const end   = rec.compoundManualEnd   || (allTimes.length ? allTimes.reduce((a,b) => a > b ? a : b) : null);
    // 各業務の開始時刻を取得して時間軸順にソート
    const tbl2 = getEffectiveShiftTable(dateKey);
    const parts = [];
    kobans.forEach(n => {
      let startTime = null;
      if (modes[n] === 'all') {
        const s = tbl2[String(n).padStart(3,'0') + '交番'];
        if (s) startTime = s.start;
      } else {
        const pd = partialData[n] || {};
        startTime = pd.start || null;
      }
      const label = modes[n] === 'all' ? `${String(n).padStart(3,'0')}` : `${String(n).padStart(3,'0')}交番一部`;
      parts.push({ label, startTime });
    });
    // 作業内容を開始時刻付きで追加
    tasks.forEach(t => {
      parts.push({ label: t.name || t.type || '', startTime: t.start || null });
    });
    // workItems（新データ構造）にも対応
    const workItems = rec.workItems || [];
    if (workItems.length > 0) {
      // workItemsがある場合はそちらを優先
      const wiParts = [...workItems].sort((a,b) => (a.startTime||'99:99').localeCompare(b.startTime||'99:99'));
      const wiLabel = wiParts.map(item => {
        if (item.type === 'all') return item.code || '';
        if (item.type === 'part') return (item.code || '') + '交番一部';
        return item.label || '';
      }).join('＆');
      const wiTimes = workItems.map(i => [i.startTime, i.endTime]).flat().filter(Boolean);
      const wiStart = rec.multiWorkStart || (wiTimes.length ? wiTimes.reduce((a,b)=>a<b?a:b) : null);
      const wiEnd   = rec.multiWorkEnd   || (wiTimes.length ? wiTimes.reduce((a,b)=>a>b?a:b) : null);
      return { label: wiLabel || '複合業務', start: wiStart, end: wiEnd, type: 'work' };
    }
    // 開始時刻でソート（nullは後ろ）
    parts.sort((a, b) => {
      if (!a.startTime && !b.startTime) return 0;
      if (!a.startTime) return 1;
      if (!b.startTime) return -1;
      return a.startTime.localeCompare(b.startTime);
    });
    const label = parts.length ? parts.map(p => p.label).join('＆') : (rec.compoundLabel || '複合業務');
    return { label, start, end, type: 'work' };
  }
  if (HOLIDAY_SHIFTS[rec.shift]) return { label: HOLIDAY_SHIFTS[rec.shift], start: null, end: null, type: rec.shift === '503交番' ? 'paid' : rec.shift === '501交番' ? 'holiday' : rec.shift === '504交番' ? 'plan' : 'off' };
  const tbl = getEffectiveShiftTable(dateKey);
  const s = tbl[rec.shift];
  if (s) return { label: String(parseInt(rec.shift.replace('交番',''))).padStart(3,'0'), start: s.start, end: s.end, type: 'work' };
  return null;
}
function getIntervalHours(dateKey) {
  const info = getShiftInfo(dateKey);
  if (!info || !info.start) return null;
  const prev = new Date(dateKey); prev.setDate(prev.getDate()-1);
  const prevInfo = getShiftInfo(fmtDate(prev));
  if (!prevInfo || !prevInfo.end) return null;
  return diffMin(parseTime(prevInfo.end), parseTime(info.start));
}
function getSleepHours(dateKey) {
  // 設計：sleepには「この日の起床に対応する就寝時刻」を入力する
  // （前夜23時台でも深夜0〜4時台でも、起床と対になる日付に入力）
  // よって sleep と wake は常に当日データ同士で計算する
  const rec = appData[dateKey];
  if (!rec || !rec.life) return null;
  const sleep = parseTime(rec.life.sleep);
  const wake  = parseTime(rec.life.wake);
  if (sleep === null || wake === null) return null;
  return diffMin(sleep, wake);
}

  } else {
    const d = new Date(selectedDate);
    el.textContent = `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;
  }
}

function render() {
  updateNavTitle();
  if (view === 'month')      renderMonth();
  else if (view === 'day')   renderDay();
  else if (view === 'stats') renderStats();
  else if (view === 'spec')  renderSpec();
  else                       renderDay();
}

// ══════════════════════════════════════════
// MONTH LIST VIEW
// ══════════════════════════════════════════
function renderMonthList(c, year, month, todayKey, toggleBtn) {
  const daysInMonth = new Date(year, month+1, 0).getDate();

  function metricHtml(label, val, cls) {
    return `<div class="wvl-metric-group"><span class="wvl-lbl">${label}</span><span class="wvl-metric ${cls}">${val}</span></div>`;
  }
  function lifeHtml(icon, val) {
    return `<span class="wvl-life"><span class="wvl-life-icon">${icon}</span>${val || '—'}</span>`;
  }

  let blocks = '';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = fmtDate(new Date(year, month, d));
    const dow = new Date(year, month, d).getDay();
    const isToday = dateKey === todayKey;
    const info = getShiftInfo(dateKey);
    const rec = appData[dateKey] || {};
    const life = rec.life || {};

    const dowLabel = DOW[dow];
    const dowCls = dow === 6 ? 'wvl-dow sat' : dow === 0 ? 'wvl-dow sun' : 'wvl-dow';
    const numCls  = dow === 6 ? 'wvl-daynum sat' : dow === 0 ? 'wvl-daynum sun' : 'wvl-daynum';
    const dayNumHtml = isToday
      ? `<div class="${numCls} today-circle">${d}</div>`
      : `<div class="${numCls}">${d}</div>`;

    // シフトバッジ
    let shiftBadge = '<span class="wvl-none">— 未入力 —</span>';
    let timeRange = '';
    if (info) {
      const bc = info.type === 'work' ? 'b-work' : info.type === 'holiday' ? 'b-off' : info.type === 'paid' ? 'b-off' : info.type === 'plan' ? 'b-plan' : 'b-off';
      shiftBadge = `<span class="wvl-badge ${bc}">${info.label}</span>`;
      if (info.start && info.end) timeRange = `<span class="wvl-sep">|</span><span class="wvl-timerange">${info.start}–${info.end}</span>`;
    }

    // サマリー
    let workVal = '—', workCls = 'm-none';
    if (info && info.start && info.end) {
      const wm = diffMin(parseTime(info.start), parseTime(info.end));
      workVal = fmtMin(wm); workCls = wm > 780 ? 'm-warn' : 'm-ok';
    }
    const im = getIntervalHours(dateKey);
    const intervalCls = im === null ? 'm-none' : im < 600 ? 'm-bad' : im < 660 ? 'm-warn' : 'm-ok';
    const sm = getSleepHours(dateKey);
    const sleepCls = sm === null ? 'm-none' : sm < 360 ? 'm-bad' : sm < 420 ? 'm-warn' : 'm-ok';

    const irodoriIcons = getIrodoriIcons(dateKey);
    const irodoriHtml = irodoriIcons.length
      ? `<span class="wvl-sep">|</span><span class="wvl-lbl">IRODORI</span><span class="wvl-irodori">${irodoriIcons.join('')}</span>`
      : `<span class="wvl-sep">|</span><span class="wvl-lbl">IRODORI</span><span class="wvl-none">—</span>`;

    const todayStyle = isToday ? 'border:1.5px solid var(--accent);box-shadow:0 0 0 2px rgba(14,168,216,.15);' : '';

    blocks += `
    <div class="wvl-day-block" style="${todayStyle}" onclick="selectDate('${dateKey}')">
      <div style="display:grid;grid-template-columns:58px 1fr;grid-template-rows:auto auto;">
        <div class="wvl-date-cell" style="grid-row:1/3;">
          <div class="${dowCls}">${dowLabel}</div>
          ${dayNumHtml}
        </div>
        <div class="wvl-row1">
          ${shiftBadge}${timeRange}
          <span class="wvl-sep">|</span>
          ${metricHtml('勤務時間', workVal, workCls)}
          ${metricHtml('勤務間', im === null ? '—' : fmtMin(im), intervalCls)}
          ${metricHtml('睡眠', sm === null ? '—' : fmtMin(sm), sleepCls)}
        </div>
        <div class="wvl-row2">
          ${lifeHtml('💤', life.sleep)}
          ${lifeHtml('☀️', life.wake)}
          ${lifeHtml('🚿', life.ready)}
          ${lifeHtml('🚃', life.commute)}
          ${irodoriHtml}
        </div>
      </div>
    </div>`;
  }

  c.innerHTML = `<div style="background:var(--bg);padding-bottom:24px;">${toggleBtn}<div style="padding:4px 10px 0;">${blocks}</div></div>`;
}

// ══════════════════════════════════════════
// MONTH VIEW
// ══════════════════════════════════════════
function renderMonth() {
  const c = document.getElementById('viewContainer');
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const todayKey = fmtDate(today);

  // グリッド/リスト切り替えボタン＋印刷ボタン
  const isList = window._monthViewMode === 'list';
  const toggleBtn = `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 14px 2px;">
    <div style="display:flex;background:var(--surface2);border-radius:8px;border:1px solid var(--border2);overflow:hidden;">
      <button onclick="window._monthViewMode='grid';renderMonth()" style="font-size:13px;font-weight:700;padding:6px 14px;border:none;cursor:pointer;font-family:var(--sans);background:${!isList?'var(--accent)':'transparent'};color:${!isList?'#fff':'var(--muted)'};">📅 グリッド</button>
      <button onclick="window._monthViewMode='list';renderMonth()" style="font-size:13px;font-weight:700;padding:6px 14px;border:none;cursor:pointer;font-family:var(--sans);background:${isList?'var(--accent)':'transparent'};color:${isList?'#fff':'var(--muted)'};">📋 リスト</button>
    </div>
    ${isList ? `<button onclick="showPrintModal()" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1.5px solid var(--border2);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-family:var(--sans);" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border2)';this.style.color='var(--muted)'">🖨️ 印刷</button>` : ''}
  </div>`;

  if (isList) {
    renderMonthList(c, year, month, todayKey, toggleBtn);
    return;
  }

  const startDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  let html = toggleBtn + '<div class="month-grid"><div class="dow-row">';
  ['日','月','火','水','木','金','土'].forEach((d,i) => {
    html += `<div class="dow-cell ${i===0?'sun':i===6?'sat':''}">${d}</div>`;
  });
  html += '</div><div class="cal-grid">';

  const prevDays = new Date(year, month, 0).getDate();
  for (let i = startDow-1; i >= 0; i--) {
    html += renderCalCell(year, month-1, prevDays-i, fmtDate(new Date(year, month-1, prevDays-i)), true, todayKey);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    html += renderCalCell(year, month, d, fmtDate(new Date(year, month, d)), false, todayKey);
  }
  const total = startDow + daysInMonth;
  const rem = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= rem; d++) {
    html += renderCalCell(year, month+1, d, fmtDate(new Date(year, month+1, d)), true, todayKey);
  }
  html += '</div></div>';

  // 公休日設定パネル
  const phKey = `publicHolidays_${year}-${String(month+1).padStart(2,'0')}`;
  const phSelected = (appData[phKey] || []);
  const DOW_LABELS = ['日','月','火','水','木','金','土'];
  const DOW_NAMES = ['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];
  const resultText = phSelected.length > 0
    ? `📅 ${year}年${month+1}月の公休日：${phSelected.map(i=>DOW_NAMES[i]).join('・')}`
    : '（未設定）';
  html += `<div style="background:#fff8ee;border-top:2px solid #f5c060;padding:14px 16px;">
    <div style="font-size:16px;font-weight:700;color:#a06000;margin-bottom:10px;">📅 当月の公休日設定 <span style="font-size:12px;color:#888;font-weight:400;">— 曜日をタップして選択</span></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">
      ${DOW_LABELS.map((lbl,i)=>{
        const active = phSelected.includes(i);
        const col = i===0?'#e03535':i===6?'#1a8faa':'#555';
        return `<button onclick="togglePublicHoliday(${year},${month},${i})"
          style="text-align:center;font-size:14px;padding:9px 4px;border-radius:8px;
          border:${active?'1.5px solid #f5a623':'1.5px solid #e0d0b0'};
          background:${active?'#f5a623':'#fff'};
          color:${active?'#fff':col};font-weight:${active?'700':'400'};cursor:pointer;">${lbl}</button>`;
      }).join('')}
    </div>
    <div style="margin-top:10px;font-size:13px;color:#a06000;background:#fff3d0;border-radius:8px;padding:8px 12px;border:1px solid #f5c060;">${resultText}</div>
  </div>`;

  c.innerHTML = html;
}

function togglePublicHoliday(year, month, dowIndex) {
  const phKey = `publicHolidays_${year}-${String(month+1).padStart(2,'0')}`;
  let arr = appData[phKey] ? [...appData[phKey]] : [];
  if (arr.includes(dowIndex)) {
    arr = arr.filter(i => i !== dowIndex);
  } else {
    arr.push(dowIndex);
    arr.sort();
  }
  appData[phKey] = arr;
  saveData(appData);
  renderMonth();
  updateNavTitle();
}

function renderCalCell(year, month, day, dateKey, other, todayKey) {
  const dow = new Date(year, month, day).getDay();
  const isToday = dateKey === todayKey;
  const isSel = dateKey === selectedDate;
  const info = getShiftInfo(dateKey);
  const rec = appData[dateKey] || {};
  let cls = 'cal-cell';
  if (other) cls += ' other-month';
  if (isToday) cls += ' today';
  if (isSel) cls += ' selected';
  if (dow === 0) cls += ' sun';
  if (dow === 6) cls += ' sat';

  let inner = `<div class="cal-date">${day}</div>`;

  if (info && !other) {
    if (info.type !== 'work') {
      // 休日系：1行だけ
      const hCls = info.type === 'holiday' ? 'holiday' : info.type === 'paid' ? 'paid' : info.type === 'plan' ? 'plan' : 'off';
      inner += `<div class="cal-shift ${hCls}">${info.label}</div>`;
    } else if (rec.shift === 'compound') {
      // 複合業務：新旧データ構造両対応
      const workItems = rec.workItems || [];
      if (workItems.length > 0) {
        // 新データ構造（workItems）
        const sorted = [...workItems].sort((a,b) => (a.startTime||'99:99').localeCompare(b.startTime||'99:99'));
        sorted.forEach(item => {
          if (item.type === 'training' || item.type === 'task') {
            inner += `<div class="cal-shift task">${item.label || '業務習得'}</div>`;
          } else if (item.type === 'garage') {
            inner += `<div class="cal-shift garage">${item.label || '車庫整理'}</div>`;
          } else if (item.type === 'other') {
            inner += `<div class="cal-shift other">${item.label || 'その他'}</div>`;
          } else if (item.type === 'all') {
            inner += `<div class="cal-shift work">${item.code || ''}</div>`;
          } else if (item.type === 'part') {
            inner += `<div class="cal-shift task2">${item.code || ''}一部</div>`;
          }
        });
      } else {
        // 旧データ構造（compoundKobans / taskContents）
        const tasks = rec.taskContents || [];
        const kobans = rec.compoundKobans || [];
        const modes = rec.compoundKobanModes || {};
        tasks.forEach((t, i) => {
          const cls2 = i % 2 === 0 ? 'task' : 'task2';
          inner += `<div class="cal-shift ${cls2}">${t.name}</div>`;
        });
        kobans.forEach(n => {
          const lbl = modes[n] === 'all' ? `${String(n).padStart(3,'0')}` : `${String(n).padStart(3,'0')}一部`;
          inner += `<div class="cal-shift work">${lbl}</div>`;
        });
      }
      if (info.start) inner += `<div class="cal-time">${info.start}–${info.end}</div>`;
    } else {
      // 通常シフト（trainingも含む）
      const tasks = rec.taskContents || [];
      // 業務習得パネルのラベル
      if (rec.trainingLabel || rec.trainingStart) {
        inner += `<div class="cal-shift task">${rec.trainingLabel || '業務習得'}</div>`;
      }
      tasks.forEach((t, i) => {
        const cls2 = i % 2 === 0 ? 'task' : 'task2';
        inner += `<div class="cal-shift ${cls2}">${t.name}</div>`;
      });
      inner += `<div class="cal-shift work">${info.label}</div>`;
      if (info.start) inner += `<div class="cal-time">${info.start}–${info.end}</div>`;
    }
  } else if (info && other) {
    // 前後月セルは簡略表示
    const sc = info.type === 'work' ? 'work' : 'off';
    inner += `<div class="cal-shift ${sc}">${info.label}</div>`;
  }

  // IRODORIアイコン
  if (!other) {
    const irodoriIcons = getIrodoriIcons(dateKey);
    if (irodoriIcons.length > 0) {
      inner += `<div class="cal-irodori-icons">${irodoriIcons.map(ic => `<span class="cal-irodori-icon">${ic}</span>`).join('')}</div>`;
    }
  }
  return `<div class="${cls}" onclick="selectDate('${dateKey}')">${inner}</div>`;
}

function selectDate(key) {
  selectedDate = key;
  switchView('day');
}

// ══════════════════════════════════════════
// STATS VIEW
// ══════════════════════════════════════════
function renderStats() {
  const c = document.getElementById('viewContainer');
  const year = statsCursor.getFullYear();
  const month = statsCursor.getMonth();

  // 集計対象の日付キー一覧を生成
  let keys = [];
  if (statsPeriod === 'month') {
    const daysInMonth = new Date(year, month+1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      keys.push(fmtDate(new Date(year, month, d)));
    }
  } else {
    for (let m = 0; m < 12; m++) {
      const dim = new Date(year, m+1, 0).getDate();
      for (let d = 1; d <= dim; d++) {
        keys.push(fmtDate(new Date(year, m, d)));
      }
    }
  }

  // データ収集
  let workArr = [], ivArr = [], sleepArr = [];
  let workDays = 0, holidayDays = 0, paidDays = 0, offDays = 0;
  let totalWorkMin = 0;
  let ivViolations = 0; // 勤務間10時間未満

  keys.forEach(key => {
    const info = getShiftInfo(key);
    if (info) {
      if (info.type === 'work') {
        workDays++;
        const wm = diffMin(parseTime(info.start), parseTime(info.end));
        workArr.push({ key, val: wm });
        totalWorkMin += wm;
      } else if (info.type === 'holiday') holidayDays++;
      else if (info.type === 'paid') paidDays++;
      else offDays++;
    }
    const iv = getIntervalHours(key);
    if (iv !== null) {
      ivArr.push({ key, val: iv });
      if (iv < 600) ivViolations++; // 10時間 = 600分
    }
    const sl = getSleepHours(key);
    if (sl !== null) sleepArr.push({ key, val: sl });
  });

  const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b.val,0)/arr.length) : null;
  const avgWork  = avg(workArr);
  const avgIv    = avg(ivArr);
  const avgSleep = avg(sleepArr);

  function avgBox(icon, label, minutes, goodThresh, warnThresh, sub) {
    let cls = 'stats-avg-val';
    if (minutes !== null) {
      cls += minutes >= goodThresh ? ' ok' : minutes >= warnThresh ? ' warn' : ' bad';
    }
    return `<div class="stats-avg-box">
      <div class="stats-avg-icon">${icon}</div>
      <div class="stats-avg-label">${label}</div>
      <div class="${cls}">${minutes !== null ? fmtMin(minutes) : '--:--'}</div>
      <div class="stats-avg-sub">${sub}</div>
      <div class="stats-avg-count">${minutes !== null ? (label==='勤務間' ? ivArr.length : label==='睡眠' ? sleepArr.length : workArr.length)+'件' : 'データなし'}</div>
    </div>`;
  }

  // バーチャート（月ビュー：日別勤務時間 / 年ビュー：月別平均勤務時間）
  let barHtml = '';
  if (statsPeriod === 'month') {
    const maxW = workArr.length ? Math.max(...workArr.map(x=>x.val)) : 600;
    barHtml = workArr.slice(-20).map(x => {
      const d = new Date(x.key).getDate();
      const pct = Math.round(x.val / maxW * 100);
      const color = x.val > 780 ? 'var(--amber)' : 'var(--accent)';
      return `<div class="stats-bar-col">
        <div class="stats-bar" style="height:${pct}%;background:${color};"></div>
        <div class="stats-bar-lbl">${d}</div>
      </div>`;
    }).join('');
    if (!barHtml) barHtml = '<div style="color:var(--muted);font-size:12px;text-align:center;width:100%;padding:20px 0;">勤務データなし</div>';
  } else {
    // 年ビュー：月別平均勤務時間
    const monthLabels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    const monthAvgs = Array.from({length:12}, (_,m) => {
      const mkeys = Array.from({length: new Date(year,m+1,0).getDate()}, (_,d) => fmtDate(new Date(year,m,d+1)));
      const mwork = mkeys.flatMap(k => {
        const info = getShiftInfo(k);
        if (!info || !info.start || !info.end) return [];
        return [{ key:k, val: diffMin(parseTime(info.start), parseTime(info.end)) }];
      });
      return mwork.length ? Math.round(mwork.reduce((a,b)=>a+b.val,0)/mwork.length) : null;
    });
    const maxM = Math.max(...monthAvgs.filter(x=>x!==null), 600);
    barHtml = monthLabels.map((lbl, m) => {
      const val = monthAvgs[m];
      if (val === null) return `<div class="stats-bar-col"><div class="stats-bar" style="height:4%;background:var(--border);"></div><div class="stats-bar-lbl">${m+1}</div></div>`;
      const pct = Math.round(val / maxM * 100);
      const color = val > 780 ? 'var(--amber)' : 'var(--accent)';
      return `<div class="stats-bar-col">
        <div class="stats-bar" style="height:${pct}%;background:${color};"></div>
        <div class="stats-bar-lbl">${m+1}</div>
      </div>`;
    }).join('');
  }

  // 折れ線チャート（睡眠・勤務間）
  function buildLineChart(arr1, arr2, color1, color2, maxPts) {
    const pts1 = arr1.slice(-maxPts);
    const pts2 = arr2.slice(-maxPts);
    const allVals = [...pts1.map(x=>x.val), ...pts2.map(x=>x.val)];
    if (!allVals.length) return '<div class="stats-empty">データが足りません</div>';
    const minV = Math.min(...allVals) - 30;
    const maxV = Math.max(...allVals) + 30;
    const W = 280, H = 80;
    const count = Math.max(pts1.length, pts2.length, 1);
    const xStep = count > 1 ? W / (count - 1) : W / 2;

    function toXY(arr) {
      return arr.map((x, i) => {
        const px = Math.round(i * xStep);
        const py = Math.round(H - ((x.val - minV) / (maxV - minV)) * H);
        return `${px},${py}`;
      });
    }

    const poly1 = toXY(pts1);
    const poly2 = toXY(pts2);

    const dots1 = pts1.map((x,i) => {
      const px = Math.round(i * xStep);
      const py = Math.round(H - ((x.val - minV) / (maxV - minV)) * H);
      return `<circle cx="${px}" cy="${py}" r="3" fill="${color1}"/>`;
    }).join('');
    const dots2 = pts2.map((x,i) => {
      const px = Math.round(i * xStep);
      const py = Math.round(H - ((x.val - minV) / (maxV - minV)) * H);
      const bad = arr2 === ivArr && x.val < 600;
      return `<circle cx="${px}" cy="${py}" r="3" fill="${bad ? 'var(--red)' : color2}"/>`;
    }).join('');

    const line1 = poly1.length > 1 ? `<polyline points="${poly1.join(' ')}" fill="none" stroke="${color1}" stroke-width="2" stroke-linejoin="round"/>` : '';
    const line2 = poly2.length > 1 ? `<polyline points="${poly2.join(' ')}" fill="none" stroke="${color2}" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 3"/>` : '';

    return `<div class="stats-line-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <line x1="0" y1="${Math.round(H/3)}" x2="${W}" y2="${Math.round(H/3)}" stroke="var(--border)" stroke-width="0.5"/>
        <line x1="0" y1="${Math.round(H*2/3)}" x2="${W}" y2="${Math.round(H*2/3)}" stroke="var(--border)" stroke-width="0.5"/>
        ${line1}${line2}${dots1}${dots2}
      </svg>
    </div>`;
  }

  const lineChart = buildLineChart(sleepArr, ivArr, 'var(--accent)', 'var(--green)', statsPeriod === 'month' ? 20 : 50);

  // 違反アラート（勤務間10時間未満）
  const alertHtml = ivViolations > 0
    ? `<div class="stats-alert bad"><div class="stats-alert-icon">⚠️</div>勤務間10時間未満が ${ivViolations}日 あります</div>`
    : ivArr.length > 0
    ? `<div class="stats-alert" style="background:#e6faef;border-color:var(--green);color:#0a6e3e;"><div class="stats-alert-icon">✅</div>勤務間違反なし</div>`
    : '';

  // 期間切替ボタン
  const toggleHtml = `<div class="stats-period-bar">
    <span class="stats-period-label">表示期間</span>
    <div class="stats-period-toggle">
      <button class="${statsPeriod==='month'?'active':''}" onclick="statsPeriod='month';render()">月</button>
      <button class="${statsPeriod==='year'?'active':''}" onclick="statsPeriod='year';render()">年</button>
    </div>
  </div>`;

  // 集計テーブル
  const summaryHtml = `
    <div class="stats-summary-row">
      <span class="stats-summary-label">勤務日数</span>
      <span class="stats-summary-val">${workDays}日</span>
    </div>
    <div class="stats-summary-row">
      <span class="stats-summary-label">公休 / 振替 / 有給</span>
      <span class="stats-summary-val">${holidayDays}日 / ${offDays}日 / ${paidDays}日</span>
    </div>
    <div class="stats-summary-row">
      <span class="stats-summary-label">合計勤務時間</span>
      <span class="stats-summary-val accent">${fmtMin(totalWorkMin)}</span>
    </div>
    <div class="stats-summary-row">
      <span class="stats-summary-label">勤務間データ件数</span>
      <span class="stats-summary-val">${ivArr.length}件</span>
    </div>
    <div class="stats-summary-row">
      <span class="stats-summary-label">睡眠データ件数</span>
      <span class="stats-summary-val">${sleepArr.length}件</span>
    </div>
  `;

  c.innerHTML = `<div class="stats-view">
    ${toggleHtml}
    <div class="stats-avg-grid">
      ${avgBox('⏳','勤務時間', avgWork, 1, 1, '平均/勤務日')}
      ${avgBox('🔄','勤務間', avgIv, 660, 600, '平均')}
      ${avgBox('😴','睡眠', avgSleep, 420, 360, '平均/日')}
    </div>
    ${alertHtml}
    <div class="stats-card">
      <div class="stats-card-header">⏳ 勤務時間${statsPeriod==='month'?'（日別）':'（月別平均）'}</div>
      <div class="stats-card-body">
        <div class="stats-bar-wrap">${barHtml}</div>
        <div class="stats-legend">
          <div class="stats-legend-item"><div class="stats-legend-dot" style="background:var(--accent);"></div>通常</div>
          <div class="stats-legend-item"><div class="stats-legend-dot" style="background:var(--amber);"></div>長時間（13時間超）</div>
        </div>
      </div>
    </div>
    <div class="stats-card">
      <div class="stats-card-header">📈 睡眠 / 勤務間の推移</div>
      <div class="stats-card-body">
        ${lineChart}
        <div class="stats-legend">
          <div class="stats-legend-item"><div class="stats-legend-dot" style="background:var(--accent);"></div>睡眠時間</div>
          <div class="stats-legend-item"><div class="stats-legend-dot" style="background:var(--green);border:1px dashed var(--green);"></div>勤務間時間</div>
          <div class="stats-legend-item"><div class="stats-legend-dot" style="background:var(--red);"></div>10時間未満違反</div>
        </div>
      </div>
    </div>
    <div class="stats-card">
      <div class="stats-card-header">🗒️ 集計</div>
      <div class="stats-card-body">${summaryHtml}</div>
    </div>
  </div>`;
}

function renderInput() {
  const c = document.getElementById('viewContainer');
  const key = selectedDate;
  const rec = appData[key] || { shift: null, life: {} };
  const life = rec.life || {};

  const allShiftIds = Object.keys(getEffectiveShiftTable(key)).sort((a,b) => parseInt(a)-parseInt(b));

  });

  const specialHtml = holidayHtml + workBtnsHtml;

      const timeStr4 = s4 ? s4.start + ' 〜 ' + s4.end : '';
      compoundPanelHtml = `
        <div style="background:#fff;border:1.5px solid #c5eaf5;border-radius:14px;padding:14px 16px;margin-top:10px;">

              style="font-family:var(--mono);font-size:26px;font-weight:900;color:#0878a0;background:#c8eef8;border:2px solid #4ab8d8;border-radius:10px;padding:7px 10px;text-align:center;width:88px;outline:none;"
              onchange="onWorkModeCodeInput('${key}',this.value)">

            style="width:100%;font-size:16px;font-weight:700;padding:11px;border-radius:10px;border:none;background:#4ab8d8;color:#fff;cursor:pointer;">✅ 確定</button>

    } else if (wmt === 'part') {

          <button onclick="confirmWorkModeTask('${key}','${wmt}')"

  let registeredListHtml = '';

        : `<span style="font-size:12px;font-weight:800;color:#0a5e2a;background:#d4f5e5;border-radius:6px;padding:4px 8px;">${item.label||''}</span>`;
      const modeLabel = item.type==='all'?'交番通り':item.type==='part'?'交番一部':item.label||'';
      const modeColor = item.type==='part'?'#f5a623':item.type==='all'?'#4ab8d8':'#0a5e2a';
      const timeStr = item.startTime && item.endTime ? item.startTime+' 〜 '+item.endTime : item.startTime||'';

        ${codeBadge}
        <div style="flex:1;">
          <div style="font-size:11px;font-weight:700;color:${modeColor};margin-bottom:2px;">${modeLabel}</div>
          <div style="font-size:13px;font-weight:700;color:#333;">${timeStr}</div>
          ${tripStr?`<div style="font-size:11px;color:#4ab8d8;font-family:var(--mono);margin-top:2px;">${tripStr}</div>`:''}
        </div>
        <button style="font-size:17px;background:none;border:none;cursor:pointer;" onclick="editWorkItem('${key}',${i})">✏️</button>
        <button style="font-size:13px;color:var(--red);background:none;border:none;cursor:pointer;font-weight:700;" onclick="deleteWorkItem('${key}',${i})">✕</button>

    registeredListHtml = `

        <div style="background:#4ab8d8;color:#fff;padding:9px 14px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;">
          登録済み業務

        </div>
        ${itemsHtml}

      <div class="lc-calc-label">出社 → 会社到着</div>

        ${compoundPanelHtml}
        ${trainingPanelHtml}
