<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<title>IRODORI MK-33</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:      #f0faf2;
  --surface: #ffffff;
  --surface2:#e8faf2;
  --border:  #8ee0b8;
  --border2: #2ecf7a;
  --green:   #2ecf7a;
  --green2:  #1aaf60;
  --green3:  #0a5e2a;
  --muted:   #5aaa7a;
  --text:    #0a2e14;
  --work:    #0ea8d8;
  --workbg:  #e0f7fa;
  --workbd:  #80deea;
  --amber:   #f59e0b;
  --amberbg: #fffbeb;
  --amberbd: #fcd34d;
  --red:     #e03535;
  --orange:  #f07d00;
  --orangebg:#fff0d9;
  --orangebd:#f5be6a;
  --shadow:  0 2px 10px rgba(46,207,122,.10);
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans JP', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--sans); background:var(--bg); color:var(--text); min-height:100vh; }

/* ══ HEADER ══ */
.header {
  position:sticky; top:0; z-index:200;
  background:rgba(255,255,255,0.94); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:0 14px; display:flex; align-items:center; justify-content:space-between;
  height:54px; gap:10px; box-shadow:0 2px 12px rgba(46,207,122,.08);
}
.logo { font-family:var(--mono); font-size:16px; letter-spacing:2px; color:var(--green2); font-weight:500; }
.logo-sub { font-size:10px; color:var(--muted); letter-spacing:1px; margin-left:6px; }

/* ══ TAB BAR ══ */
.tab-bar {
  display:flex; gap:2px; background:var(--surface2);
  border-radius:10px; padding:3px; border:1px solid var(--border);
}
.tab {
  font-family:var(--sans); font-size:12px; font-weight:600;
  padding:5px 11px; border-radius:7px; cursor:pointer;
  border:none; background:transparent; color:var(--muted); transition:all .16s;
}
.tab.active { background:var(--green); color:#fff; box-shadow:0 2px 8px rgba(46,207,122,.35); }
.tab:hover:not(.active) { color:var(--text); background:var(--border); }

/* ══ NAV ROW ══ */
.nav-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px 8px;
}
.nav-title { font-size:18px; font-weight:700; color:var(--text); }
.nav-btns { display:flex; gap:6px; }
.nav-btn {
  height:32px; border-radius:8px; border:1px solid var(--border2);
  background:var(--surface); color:var(--text); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all .14s; padding:0 10px; box-shadow:var(--shadow);
  font-family:var(--sans); font-weight:600;
}
.nav-btn:hover { border-color:var(--green2); color:var(--green2); background:var(--surface2); }

/* ══ SECTION LABEL ══ */
.section-label {
  font-size:11px; font-weight:800; letter-spacing:1.5px;
  color:var(--muted); text-transform:uppercase;
  padding:0 2px; margin-bottom:8px; margin-top:16px;
}

/* ══ 月表示（7列グリッド） ══ */
.month-grid { padding: 0 10px 80px; }
.dow-row { display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
.dow-cell {
  text-align:center; font-size:11px; font-weight:700;
  padding:6px 0; color:var(--muted); letter-spacing:0.8px;
}
.dow-cell.sat { color:var(--work); }
.dow-cell.sun { color:var(--red); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-cell {
  background:var(--surface); border-radius:9px; padding:5px 4px 6px;
  min-height:70px; cursor:pointer;
  border:1.5px solid var(--border);
  transition:border-color .13s, box-shadow .13s;
  box-shadow:var(--shadow);
}
.cal-cell:hover { border-color:var(--green2); box-shadow:0 3px 14px rgba(46,207,122,.18); }
.cal-cell.other-month { opacity:.38; box-shadow:none; }
.cal-cell.today { border-color:var(--green); box-shadow:0 0 0 2px rgba(46,207,122,.22); }
.cal-cell.selected { border-color:var(--green2); background:#e6faef; }
.cal-cell.sun .cal-date { color:var(--red); }
.cal-cell.sat .cal-date { color:var(--work); }
.cal-date {
  font-family:var(--mono); font-size:12px; font-weight:600;
  margin-bottom:3px; color:var(--text);
}
.cal-cell.today .cal-date {
  background:var(--green); color:#fff;
  width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  margin-bottom:3px; font-size:11px;
}
.cal-cell.today.sat .cal-date,
.cal-cell.today.sun .cal-date { color:#fff; }
.cal-shift {
  font-size:11px; font-weight:700; letter-spacing:0.2px;
  padding:2px 4px; border-radius:4px; display:block;
  margin-bottom:2px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cal-shift.work    { background:#c8eef8; color:#007c91; }
.cal-shift.off     { background:#ffd9d9; color:#a01010; }
.cal-shift.paid    { background:#ffd9d9; color:#a01010; }
.cal-shift.plan    { background:var(--orangebg); color:#a05000; }
.cal-shift.task    { background:#d4f5e5; color:#0a5e2a; }
.cal-shift.task2   { background:#fff3cc; color:#8a5c00; }
.cal-irodori-icons { display:flex; flex-wrap:wrap; gap:1px; margin-top:2px; }
.cal-irodori-icon  { font-size:11px; line-height:1; }

/* ══ 日表示 ══ */
.day-view { padding:0 14px 80px; max-width:620px; margin:0 auto; }

.day-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow);
}
.day-card-head {
  padding:11px 16px; background:var(--surface2);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.day-card-title { font-size:14px; font-weight:700; color:var(--text); }
.day-card-body  { padding:13px 16px; }

/* ══ 本日の予定（起動時トップ画面） ══ */
.today-list { padding-top:6px; }
.today-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; margin-bottom:10px; padding:12px 14px;
  display:flex; align-items:center; gap:12px; cursor:pointer;
  box-shadow:var(--shadow); transition:box-shadow .15s, transform .15s;
}
.today-card:active { transform:scale(0.98); }
.today-card-time {
  font-family:var(--mono); font-size:13px; font-weight:700; color:var(--green3);
  min-width:44px; flex-shrink:0; white-space:pre-line; line-height:1.3;
}
.today-card-main { display:flex; align-items:center; gap:10px; }
.today-card-icon { font-size:20px; }
.today-card-title { font-size:14px; font-weight:700; color:var(--text); }
.today-card-sub { font-size:11px; color:var(--muted); margin-top:2px; }

/* 仕事カード（水色） */
.work-day-card {
  background:var(--workbg); border:1.5px solid var(--workbd);
  border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow);
}
.work-day-head {
  padding:11px 16px; background:#d4f2fa; border-bottom:1px solid var(--workbd);
  font-size:14px; font-weight:700; color:#007c91;
}
.work-day-body { padding:13px 16px; }
.work-main { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.work-badge-lg {
  background:var(--work); color:#fff; border-radius:8px;
  font-family:var(--mono); font-size:17px; font-weight:700; padding:3px 14px;
}
.work-time-lg { font-family:var(--mono); font-size:15px; color:#007c91; font-weight:700; }
.life-chips { display:flex; gap:7px; flex-wrap:wrap; }
.life-chip {
  background:var(--surface); border:1px solid var(--workbd);
  border-radius:7px; padding:4px 10px;
  font-family:var(--mono); font-size:12px; color:#007c91; font-weight:600;
}

/* プライベート予定行 */
.priv-item {
  display:flex; align-items:center; gap:10px;
  padding:10px 0; border-bottom:1px solid var(--border);
}
.priv-item:last-child { border-bottom:none; }
.priv-item-icon { font-size:26px; flex-shrink:0; }
.priv-item-info { flex:1; }
.priv-item-name { font-size:15px; font-weight:700; color:var(--text); }
.priv-item-memo { font-size:12px; color:var(--muted); margin-top:2px; }
.priv-item-time { font-family:var(--mono); font-size:13px; color:var(--green2); white-space:nowrap; font-weight:600; }
.priv-item-edit { font-size:14px; cursor:pointer; background:none; border:none; flex-shrink:0; padding:0 4px; opacity:0.6; }
.priv-item-edit:hover { opacity:1; }
.priv-item-del  { font-size:16px; color:var(--border); cursor:pointer; background:none; border:none; flex-shrink:0; padding:0 4px; }
.priv-item-del:hover { color:var(--red); }

/* 日記カード */
.diary-day-card {
  background:var(--surface); border:1.5px solid var(--amberbd);
  border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow);
}
.diary-day-head {
  padding:11px 16px; background:var(--amberbg); border-bottom:1px solid var(--amberbd);
  display:flex; align-items:center; justify-content:space-between;
  font-size:14px; font-weight:700; color:#92400e;
}
.diary-day-body { padding:13px 16px; }
.diary-chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.diary-chip {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:var(--surface2); border:1.5px solid var(--border);
  border-radius:10px; padding:7px 10px; cursor:pointer;
}
.diary-chip .dc-icon  { font-size:22px; }
.diary-chip .dc-label { font-size:9px; color:var(--green3); font-weight:800; }
.diary-memo {
  background:var(--amberbg); border:1px solid var(--amberbd);
  border-radius:8px; padding:9px 11px; font-size:13px; color:#78350f; line-height:1.7;
}
.diary-empty { text-align:center; padding:20px; font-size:13px; color:var(--muted); }

/* ══ タイムライン（日ビュー） ══ */
.tl-wrap {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:14px; margin-bottom:10px; padding:10px 12px 14px; box-shadow:var(--shadow);
}
.tl-body { position:relative; }
.tl-hours { position:absolute; left:0; top:0; width:34px; }
.tl-hour-label { position:absolute; font-family:var(--mono); font-size:10px; color:var(--muted); transform:translateY(-50%); }
.tl-track { position:absolute; left:38px; right:0; top:0; border-left:1px solid var(--border); }
.tl-gridline { position:absolute; left:0; right:0; border-top:1px solid #eef7ee; }
.tl-band {
  position:absolute; border-radius:7px; box-sizing:border-box; overflow:hidden;
  padding:4px 8px; margin:0 2px;
  display:flex; flex-direction:column; justify-content:center;
}
.tl-band-cat  { font-size:13px; font-weight:800; line-height:1.28; }
.tl-band-time { font-family:var(--mono); font-size:12px; font-weight:700; line-height:1.3; opacity:0.92; margin-top:2px; }
.tl-band-sub  { font-size:10px; opacity:0.75; margin-top:2px; }
.tl-now-line  { position:absolute; left:-4px; right:0; height:0; border-top:2px solid var(--red); z-index:5; }
.tl-now-dot   { position:absolute; left:-6px; width:8px; height:8px; border-radius:50%; background:var(--red); z-index:6; }
.tl-fab-row { display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px; }
.tl-fab-add {
  width:32px; height:32px; border-radius:50%; background:var(--green); border:none;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px;
  cursor:pointer; box-shadow:0 2px 8px rgba(46,207,122,.35); font-weight:700;
}
.tl-unscheduled { margin-bottom:10px; }
.tl-unscheduled-label { font-size:11px; font-weight:700; color:var(--muted); margin-bottom:6px; padding:0 2px; }
.tl-unscheduled-list { display:flex; flex-wrap:wrap; gap:8px; }
.tl-unscheduled-chip {
  display:flex; align-items:center; gap:6px; background:var(--surface2);
  border:1px solid var(--border); border-radius:20px; padding:6px 12px; cursor:pointer;
}
.tl-unscheduled-name { font-size:12px; font-weight:600; color:var(--text); }
.tl-unscheduled-cat  { font-size:9px; color:var(--muted); }

.small-btn {
  font-size:11px; font-weight:700; color:var(--green2);
  background:var(--surface); border:1.5px solid var(--green);
  border-radius:6px; padding:3px 10px; cursor:pointer; font-family:var(--sans);
  transition:all .14s;
}
.small-btn:hover { background:var(--green); color:#fff; }
.small-btn.amber { color:#d97706; border-color:var(--amberbd); }
.small-btn.amber:hover { background:var(--amber); color:#fff; }

/* ══ 入力画面 ══ */
.input-view { padding:0 14px 80px; max-width:620px; margin:0 auto; }

.inp-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow);
}
.inp-card-head {
  padding:11px 16px; background:var(--surface2);
  border-bottom:1px solid var(--border);
  font-size:14px; font-weight:700; color:var(--text);
}
.inp-card-body { padding:13px 16px; }

/* 日付セレクタ */
.date-sel-row { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.date-sel-label { font-size:13px; color:var(--muted); font-weight:600; white-space:nowrap; }
.date-inp {
  flex:1; background:var(--surface); border:1.5px solid var(--border2);
  border-radius:9px; padding:8px 12px; color:var(--text);
  font-family:var(--mono); font-size:14px; outline:none; box-shadow:var(--shadow);
}
.date-inp:focus { border-color:var(--green); }

/* アイコン選択 */
.step-label { font-size:10px; font-weight:800; color:var(--muted); letter-spacing:1px; margin-bottom:9px; }
.icon-scroll { max-height:300px; overflow-y:auto; }
.icon-scroll::-webkit-scrollbar { width:3px; }
.icon-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.cat-section { margin-bottom:12px; }
.cat-title {
  font-size:10px; font-weight:800; color:var(--muted); letter-spacing:0.5px;
  margin-bottom:6px; padding-bottom:3px; border-bottom:1px solid var(--surface2);
}
.icon-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
.cat-subsection { margin-bottom:10px; padding-left:2px; }
.cat-subtitle { font-size:11px; font-weight:700; color:var(--muted); margin-bottom:5px; }
.icon-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:var(--surface2); border:1.5px solid var(--border);
  border-radius:10px; padding:8px 4px; cursor:pointer; transition:all .12s; font-family:var(--sans);
}
.icon-btn:hover { border-color:var(--green2); background:var(--surface2); }
.icon-btn.sel   { background:var(--green); border-color:var(--green2); }
.icon-btn .ib-icon  { font-size:22px; line-height:1; }
.icon-btn .ib-label { font-size:9px; color:var(--green3); font-weight:700; text-align:center; }
.icon-btn .ib-kanji { font-size:18px; font-weight:900; color:var(--green3); line-height:1; }
.icon-btn.sel .ib-label { color:#fff; }
.icon-btn.sel .ib-kanji { color:#fff; }

/* 詳細入力フォーム */
.detail-box {
  background:var(--surface2); border:1.5px solid var(--green);
  border-radius:12px; padding:13px; margin-top:12px;
}
.detail-selected {
  display:flex; align-items:center; gap:10px; margin-bottom:13px;
  padding-bottom:10px; border-bottom:1px solid var(--border);
}
.detail-icon-big  { font-size:34px; }
.detail-icon-name { font-size:17px; font-weight:700; color:var(--text); }

.field-group { margin-bottom:11px; }
.field-label { font-size:11px; font-weight:700; color:var(--muted); margin-bottom:5px; }

.place-wrap { position:relative; }
.place-inp {
  width:100%; background:var(--surface); border:1.5px solid var(--border);
  border-radius:8px; padding:10px 13px; font-size:14px; color:var(--text);
  outline:none; font-family:var(--sans); transition:border-color .14s;
}
.place-inp:focus { border-color:var(--green); }
.place-history {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:0 0 8px 8px; border-top:none; overflow:hidden;
}
.place-hist-item {
  padding:9px 13px; font-size:13px; color:var(--text);
  border-bottom:1px solid var(--surface2); cursor:pointer;
  display:flex; align-items:center; gap:8px; transition:background .1s;
}
.place-hist-item:last-child { border-bottom:none; }
.place-hist-item:hover { background:var(--surface2); }

.time-row { display:flex; gap:8px; align-items:center; }
.time-inp {
  flex:1; background:var(--surface); border:1.5px solid var(--border);
  border-radius:8px; padding:10px 8px; font-size:16px;
  font-family:var(--mono); font-weight:600; color:var(--text);
  text-align:center; outline:none; transition:border-color .14s;
}
.time-inp:focus { border-color:var(--green); }
.time-sep { font-size:14px; color:var(--muted); font-weight:700; }

.memo-inp {
  width:100%; background:var(--surface); border:1.5px solid var(--border);
  border-radius:8px; padding:10px 13px; font-size:13px; color:var(--text);
  outline:none; font-family:var(--sans); resize:none; height:64px; transition:border-color .14s;
}
.memo-inp:focus { border-color:var(--green); }

.reg-btn {
  width:100%; background:var(--green); border:none;
  border-radius:10px; padding:13px; font-size:14px; font-weight:700;
  color:#fff; cursor:pointer; font-family:var(--sans);
  box-shadow:0 3px 10px rgba(46,207,122,.35); margin-top:4px; transition:opacity .14s;
}
.reg-btn:hover { opacity:.88; }

/* ══ 日記入力 ══ */
.diary-icon-select { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:12px; }
.diary-icon-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:var(--surface2); border:1.5px solid var(--border);
  border-radius:10px; padding:8px 4px; cursor:pointer; font-family:var(--sans); transition:all .12s;
}
.diary-icon-btn.sel { background:var(--amberbg); border-color:var(--amberbd); }
.diary-icon-btn .dbi { font-size:22px; }
.diary-icon-btn .dbl { font-size:9px; color:var(--muted); font-weight:700; }
.diary-icon-btn.sel .dbl { color:#92400e; }
.diary-text-inp {
  width:100%; background:var(--amberbg); border:1.5px solid var(--amberbd);
  border-radius:8px; padding:10px 13px; font-size:13px; color:#78350f;
  outline:none; font-family:var(--sans); resize:none; height:100px; transition:border-color .14s;
}
.diary-text-inp:focus { border-color:var(--amber); }
.diary-save-btn {
  width:100%; background:var(--amber); border:none;
  border-radius:10px; padding:12px; font-size:14px; font-weight:700;
  color:#fff; cursor:pointer; font-family:var(--sans); margin-top:10px;
  box-shadow:0 3px 10px rgba(245,158,11,.3); transition:opacity .14s;
}
.diary-save-btn:hover { opacity:.88; }

/* ══ AUTH ══ */
#authOverlay {
  position:fixed; inset:0; z-index:9999; background:var(--bg);
  display:flex; align-items:center; justify-content:center; transition:opacity .2s;
}
#authOverlay.hidden { opacity:0; pointer-events:none; visibility:hidden; }
.auth-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:18px; padding:36px 32px; width:300px;
  box-shadow:0 8px 32px rgba(46,207,122,.15);
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
.auth-logo  { font-family:var(--mono); font-size:20px; font-weight:500; color:var(--green2); letter-spacing:2px; }
.auth-title { font-size:13px; color:var(--muted); font-weight:600; letter-spacing:0.5px; }
.auth-input {
  width:100%; background:var(--surface2); border:1.5px solid var(--border2);
  border-radius:10px; padding:11px 14px; color:var(--text);
  font-family:var(--mono); font-size:16px; outline:none; transition:border-color .14s;
  text-align:center; letter-spacing:3px; box-shadow:var(--shadow);
}
.auth-input:focus { border-color:var(--green); }
.auth-btn {
  width:100%; padding:12px; background:var(--green); border:none;
  border-radius:10px; color:#fff; font-size:14px; font-weight:700;
  cursor:pointer; font-family:var(--sans); box-shadow:0 3px 12px rgba(46,207,122,.35); transition:opacity .14s;
}
.auth-btn:hover { opacity:.88; }

.fab {
  position:fixed; bottom:24px; right:20px; z-index:100;

.fab:hover { opacity:.88; transform:scale(1.06); }

.month-list { padding: 0 10px 80px; }
.ml-row {
  display: flex; align-items: flex-start; gap: 8px;

  border-radius: 10px; padding: 8px 10px; margin-bottom: 5px;

.ml-row:hover { border-color: var(--green2); }

.ml-row.ml-sun { background: #fff8f8; }
.ml-row.ml-sat { background: #f0f8ff; }

.ml-date-num-today {

.ml-num--sun { color: var(--red); }
.ml-num--sat { color: var(--work); }
.ml-dow { font-size: 9px; font-weight: 700; color: var(--muted); }
.ml-dow--sun { color: var(--red); }
.ml-dow--sat { color: var(--work); }

// TIMETABLE連携：シフト情報取得
// ══════════════════════════════════════════
function getTTShiftInfo(dateKey) {
  const ttData = loadTTData();
  const rec = ttData[dateKey];
  if (!rec || !rec.shift) return null;

  const HOLIDAY_SHIFTS = {'501交番':'公休日','502交番':'振替休日','503交番':'有給休暇','504交番':'📅 休日予定'};
  if (HOLIDAY_SHIFTS[rec.shift]) {
    const t = rec.shift === '503交番' ? 'paid' : rec.shift === '504交番' ? 'plan' : 'off';
    return { label: HOLIDAY_SHIFTS[rec.shift], start:null, end:null, type: t };
  }
  if (rec.shift === 'custom') {
    return { label: rec.customLabel||'カスタム', start:rec.customStart, end:rec.customEnd, type:'work' };
  }
  if (rec.shift === 'compound') {
    const tbl = getTTEffectiveShiftTable(dateKey);
    // workItems（TIME TABLE側の新データ構造）があれば優先
    const workItems = rec.workItems || [];
    if (workItems.length > 0) {
      const wiParts = [...workItems].sort((a,b) => (a.startTime||'99:99').localeCompare(b.startTime||'99:99'));
      const wiLabel = wiParts.map(item => {
        if (item.type === 'all') return item.code || '';
        if (item.type === 'part') return (item.code || '') + '交番の一部';
        return item.label || '';
      }).join('＆');
      const wiTimes = workItems.map(i => [i.startTime, i.endTime]).flat().filter(Boolean);
      const wiStart = rec.multiWorkStart || (wiTimes.length ? wiTimes.reduce((a,b) => a < b ? a : b) : null);
      const wiEnd   = rec.multiWorkEnd   || (wiTimes.length ? wiTimes.reduce((a,b) => a > b ? a : b) : null);
      return { label: wiLabel || '複合業務', start: wiStart, end: wiEnd, type:'work' };
    }
    // 旧データ構造（compoundKobans / taskContents / compoundPartialData）
    const kobans = rec.compoundKobans || [];
    const tasks  = rec.taskContents  || [];
    const modes  = rec.compoundKobanModes || {};
    const partialData = rec.compoundPartialData || {};
    let allTimes = tasks.map(t => t.start).concat(tasks.map(t => t.end)).filter(Boolean);
    const parts = [];
    kobans.forEach(n => {
      let startTime = null;
      if (modes[n] === 'all') {
        const s = tbl[String(n).padStart(3,'0') + '交番'];
        if (s) { allTimes.push(s.start); allTimes.push(s.end); startTime = s.start; }
      } else {
        const pd = partialData[n] || {};
        if (pd.start) allTimes.push(pd.start);
        if (pd.end) allTimes.push(pd.end);
        startTime = pd.start || null;
      }
      const label = modes[n]==='all' ? `${String(n).padStart(3,'0')}交番` : `${String(n).padStart(3,'0')}交番の一部`;
      parts.push({ label, startTime });
    });
    tasks.forEach(t => parts.push({ label: t.name || '', startTime: t.start || null }));
    parts.sort((a,b) => {
      if (!a.startTime && !b.startTime) return 0;
      if (!a.startTime) return 1;
      if (!b.startTime) return -1;
      return a.startTime.localeCompare(b.startTime);
    });
    const start = rec.compoundManualStart || (allTimes.length ? allTimes.reduce((a,b) => a < b ? a : b) : null);
    const end   = rec.compoundManualEnd   || (allTimes.length ? allTimes.reduce((a,b) => a > b ? a : b) : null);
    const label = parts.length ? parts.map(p => p.label).join('＆') : (rec.compoundLabel || '複合業務');
    return { label, start, end, type:'work' };
  }
  // 通常交番：シフトテーブルから時間を取得
  if (rec.shift && rec.shift.includes('交番')) {
    const tbl = getTTEffectiveShiftTable(dateKey);
    const s = tbl[rec.shift];
    if (s) return { label: rec.shift, start: s.start, end: s.end, type:'work' };
    return { label: rec.shift, start:null, end:null, type:'work' };
  }
  return null;
}

function switchView(v) {
  if (v !== 'input') {
    formState = { icons:[], place:'', dateStart:'', dateEnd:'', timeStart:'', timeEnd:'', memo:'' };
    inputStep = 'icons';
  }
  view = v;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['month','day','kino','spec'][i] === v);
  });
  const fab = document.getElementById('fab');
  fab.style.display = (v === 'kino' || v === 'spec' || v === 'okusuri' || v === 'okusuri_input' || v === 'okusuri_detail' || v === 'okusuri_qr' || v === 'colorsettings' || v === 'eventDetail') ? 'none' : 'flex';
  render();
}

function onFab() {
  inputDate = selectedDate;
  formState = { icons:[], place:'', dateStart:'', dateEnd:'', timeStart:'', timeEnd:'', memo:'' };
  inputStep = 'icons';
  switchView('input');
}

function navPrev() {
  if (view === 'month') cursor.setMonth(cursor.getMonth()-1);
  else { const d = parseDate(selectedDate); d.setDate(d.getDate()-1); selectedDate = fmtDate(d); }
  render();
}
function navNext() {
  if (view === 'month') cursor.setMonth(cursor.getMonth()+1);
  else { const d = parseDate(selectedDate); d.setDate(d.getDate()+1); selectedDate = fmtDate(d); }
  render();
}
function goToday() {
  cursor = new Date(today.getFullYear(), today.getMonth(), 1);
  selectedDate = fmtDate(today);

}

function setCalMode(mode) {

    document.getElementById('calModeList').style.color      = mode === 'list' ? '#fff' : 'var(--muted)';

function updateNavTitle() {
  const el = document.getElementById('navTitle');
  const toggle = document.getElementById('calModeToggle');
  if (view === 'month') {
    el.textContent = `${cursor.getFullYear()}年${cursor.getMonth()+1}月`;
    if (toggle) toggle.style.display = 'flex';
  } else {
    if (toggle) toggle.style.display = 'none';
    if (view === 'day') {
      const d = parseDate(selectedDate);
      el.textContent = `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;
    } else if (view === 'kino') {
      el.textContent = '機能';
    } else if (view === 'okusuri') {
      el.textContent = 'お薬手帳';
    } else if (view === 'okusuri_input') {
      el.textContent = 'お薬を登録';
    } else if (view === 'okusuri_detail') {
      el.textContent = '処方履歴';
    } else if (view === 'okusuri_qr') {
      el.textContent = 'QR読み取り';
    } else if (view === 'eventDetail') {
      el.textContent = '予定の詳細';
    } else if (view === 'today') {
      const d = today;

    } else if (view === 'spec') {
      el.textContent = 'EDITH';

  }

function renderMonthList() {
  const c = document.getElementById('viewContainer');
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayKey = fmtDate(today);

  let html = '<div class="month-list">';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = fmtDate(new Date(year, month, d));
    const dow = new Date(year, month, d).getDay();
    const dowLabel = ['日','月','火','水','木','金','土'][dow];
    const isToday = dateKey === todayKey;
    const isSun = dow === 0, isSat = dow === 6;
    const ttInfo = getTTShiftInfo(dateKey);
    const rec = appData[dateKey] || {};
    const events = rec.events || [];

    let rowCls = 'ml-row';
    if (isToday) rowCls += ' ml-today';
    if (isSun)   rowCls += ' ml-sun';
    if (isSat)   rowCls += ' ml-sat';

    const dateCls = isSun ? 'ml-date ml-date--sun' : isSat ? 'ml-date ml-date--sat' : 'ml-date';
    const numCls  = isToday ? 'ml-date-num-today' : (isSun ? 'ml-date-num ml-num--sun' : isSat ? 'ml-date-num ml-num--sat' : 'ml-date-num');
    const dowCls  = isSun ? 'ml-dow ml-dow--sun' : isSat ? 'ml-dow ml-dow--sat' : 'ml-dow';
    const dateInner = `<div class="${numCls}">${d}</div><div class="${dowCls}">${dowLabel}</div>`;

    let shiftHtml = '<div class="ml-shift-empty"></div>';
    if (ttInfo) {
      if (ttInfo.type === 'plan') {
        shiftHtml = `<div class="ml-shift-badge" style="background:var(--orangebg);color:#a05000;border:1px solid var(--orangebd);">${ttInfo.label}</div>`;
      } else if (ttInfo.type === 'paid' || ttInfo.type === 'off') {
        shiftHtml = `<div class="ml-shift-badge off">${ttInfo.label}</div>`;
      } else {
        const ttRec = loadTTData()[dateKey] || {};
        let shiftLabel = '';
        if (ttRec.shift === 'compound') {
          const kobans = ttRec.compoundKobans || [];
          const modes  = ttRec.compoundKobanModes || {};
          shiftLabel = kobans.map(n => modes[n]==='all'
            ? String(n).padStart(3,'0')
            : String(n).padStart(3,'0')+'一部').join('＆') || '複合';
        } else {
          shiftLabel = ttInfo.label.replace('交番','').trim().padStart(3,'0');
        }
        const timeStr = (ttInfo.start && ttInfo.end) ? `${ttInfo.start}〜${ttInfo.end}` : '';
        shiftHtml = `<div class="ml-shift-badge work">${shiftLabel}</div>${timeStr ? `<div class="ml-shift-time">${timeStr}</div>` : ''}`;
      }
    }

    let iconsHtml = '';
    if (events.length > 0) {
      iconsHtml = events.map(e => {
        const icList = e.icons || (e.icon ? [{icon:e.icon, label:e.label||''}] : []);
        const iconDisp = icList.map(ic => {
          const raw = ic.icon.startsWith('KANJI:') ? ic.icon.replace('KANJI:','') : ic.icon;
          return isKanjiIcon(raw) || ic.icon.startsWith('KANJI:')
            ? `<span class="chip-kanji">${raw}</span>`
            : `<span class="chip-icon">${ic.icon}</span>`;
        }).join('');
        const labelDisp = icList.map(ic => ic.label).join('・');
        return `<div class="ml-chip">${iconDisp}<span class="ml-chip-label">${labelDisp}</span></div>`;
      }).join('');
    }

    html += `<div class="${rowCls}" onclick="selectDate('${dateKey}')">
      <div class="${dateCls}">${dateInner}</div>
      <div class="ml-shift">${shiftHtml}</div>
      <div class="ml-icons">${iconsHtml}</div>
    </div>`;
  }
  html += '</div>';
  c.innerHTML = html;
}

          lbl = kobans.map(n => String(n).padStart(3,'0')).join('＆') || '複合';
        } else {
          lbl = ttInfo.label.replace('交番','').trim().padStart(3,'0');
        }
      }
      shiftChip = `<span class="cal-shift ${cls}">${lbl}</span>`;
    }

    let iconHtml = '';
    if (events.length > 0) {
      iconHtml = '<div class="cal-irodori-icons">';
      events.forEach(e => {
        const icList = e.icons || (e.icon ? [{icon:e.icon}] : []);
        icList.forEach(ic => {
          const raw = ic.icon.startsWith('KANJI:') ? ic.icon.replace('KANJI:','') : ic.icon;
          iconHtml += `<span class="cal-irodori-icon">${isKanjiIcon(raw)||ic.icon.startsWith('KANJI:') ? raw : ic.icon}</span>`;
        });
      });
      iconHtml += '</div>';
    }

    html += `<div class="${cellCls}" onclick="selectDate('${dateKey}')">
      <div class="cal-date">${d}</div>
      ${shiftChip}${iconHtml}
    </div>`;
  }

  // 翌月の空白
  const total = firstDow + daysInMonth;
  const remain = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= remain; i++) {
    html += `<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
  }

  html += '</div></div>';
  c.innerHTML = html;
}

function selectDate(key) {
  selectedDate = key;
  switchView('day');
}

// ══════════════════════════════════════════
// DAY VIEW
// ══════════════════════════════════════════
// ══════════════════════════════════════════
// タイムライン構築ユーティリティ
// ══════════════════════════════════════════
function getTTCalc(dateKey) {
  const ttData = loadTTData();
  const rec = ttData[dateKey];
  if (!rec || !rec.calc) return null;
  return rec.calc;
}
function parseHM(s) {
  if (!s || typeof s !== 'string' || s.indexOf(':') === -1) return null;
  const parts = s.split(':').map(Number);
  if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  return parts[0]*60 + parts[1];
}
function fmtHM(min) {
  min = ((Math.round(min) % 1440) + 1440) % 1440;
  const h = Math.floor(min/60), m = min % 60;
  return `${h}:${String(m).padStart(2,'0')}`;
}
function fmtDurationHM(min) {
  min = Math.max(0, Math.round(min));
  const h = Math.floor(min/60), m = min % 60;
  return m === 0 ? `${h}時間` : `${h}時間${m}分`;
}
function fmtMonthDay(dateKey) {
  const d = parseDate(dateKey);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

const TL_PX_PER_MIN = 32/60; // 1時間=32px
const TL_TOTAL_H = Math.round(1440 * TL_PX_PER_MIN);

function buildTimelineBands(dateKey) {
  const bands = [];
  const ttInfo = getTTShiftInfo(dateKey);
  const ttLife = getTTLife(dateKey);
  const ttCalc = getTTCalc(dateKey);

  const dObj = parseDate(dateKey);
  const tmrw = new Date(dObj); tmrw.setDate(tmrw.getDate()+1);
  const tomorrowInfo = getTTShiftInfo(fmtDate(tmrw));

  // 😴 睡眠：0:00〜起床（その日の起床に対応する前夜の就寝から続く分）
  // ラベルにはTIME TABLE側の実際の就寝時刻（当日データのsleep）を表示する
  const wakeMin = ttLife ? parseHM(ttLife.wake) : null;
  if (wakeMin !== null) {
    const sleepStr = ttLife && ttLife.sleep ? ttLife.sleep : null;
    const sleepMin = sleepStr !== null ? parseHM(sleepStr) : null;
    const sleepStartLabel = sleepStr !== null ? sleepStr : '0:00';
    const sleepDurMin = sleepMin !== null ? ((wakeMin - sleepMin + 1440) % 1440) : wakeMin;
    bands.push({ type:'sleep', start:0, end:wakeMin, bg:'#DFF3AE', fg:'#3B6D11',
      label:'😴 睡眠', timeLabel:`${sleepStartLabel}〜${fmtHM(wakeMin)}`, durLabel: fmtDurationHM(sleepDurMin) });
  }

  // 🕐 勤務間時間（朝）：前日の仕事終了〜当日の仕事開始
  // 前日が仕事でない（終了時刻が無い）場合はこの帯自体を表示しない
  const isWork = ttInfo && ttInfo.type === 'work';
  const workStartMin = isWork ? parseHM(ttInfo.start) : null;
  const workEndMinRaw = isWork ? parseHM(ttInfo.end) : null;
  const yesterday = new Date(dObj); yesterday.setDate(yesterday.getDate()-1);
  const yesterdayInfo = getTTShiftInfo(fmtDate(yesterday));
  const prevWorkEndStr = (yesterdayInfo && yesterdayInfo.type === 'work' && yesterdayInfo.end) ? yesterdayInfo.end : null;
  if (workStartMin !== null && prevWorkEndStr !== null) {
    const prevWorkEndMin = parseHM(prevWorkEndStr);
    const gapDurMin = prevWorkEndMin !== null ? ((workStartMin - prevWorkEndMin + 1440) % 1440) : workStartMin;
    bands.push({ type:'workgap', start:0, end:workStartMin, bg:'#FBDBDB', fg:'#A32D2D',
      label:'🕐 勤務間', timeLabel:`${prevWorkEndStr}〜${fmtHM(workStartMin)}`, durLabel: fmtDurationHM(gapDurMin) });
  }
  // 🕐 勤務間時間（夜）：当日の仕事終了〜24:00（翌日も仕事の場合のみ表示）
  let workEndMin = workEndMinRaw;
  if (workEndMin !== null && workStartMin !== null && workEndMin <= workStartMin) workEndMin += 0; // 日跨りは今日分のみ表示
  if (workEndMin !== null && workEndMin < 1440 && tomorrowInfo && tomorrowInfo.type === 'work') {
    bands.push({ type:'workgap', start:workEndMin, end:1440, bg:'#FBDBDB', fg:'#A32D2D',
      label:'🕐 勤務間', timeLabel:`${fmtHM(workEndMin)}〜24:00`, durLabel: fmtDurationHM(1440 - workEndMin) });
  }

  // 🌅 支度帯：起床〜会社到着
  if (wakeMin !== null) {
    let arriveMin = ttCalc && ttCalc.arriveTime ? parseHM(ttCalc.arriveTime) : null;
    if (arriveMin === null && ttLife) arriveMin = parseHM(ttLife.commute);
    if (arriveMin === null && ttLife) arriveMin = parseHM(ttLife.ready);
    if (arriveMin === null) arriveMin = wakeMin + 60;
    const parts = [`🌅${fmtHM(wakeMin)}起床`];
    if (ttLife && ttLife.ready)   parts.push(`🚿${ttLife.ready}準備`);
    if (ttLife && ttLife.commute) parts.push(`🚃${ttLife.commute}出社`);
    if (ttCalc && ttCalc.arriveTime) parts.push(`🏢${ttCalc.arriveTime}到着`);
    bands.push({ type:'prep', start:wakeMin, end:Math.max(arriveMin, wakeMin+40), bg:'#FCEFB8', fg:'#854F0B',
      label: parts.join(' → '), timeLabel:'' });
  }

  // 🚌 仕事：実際の交番・業務内容を表示（複合業務は＆でつないだ内容がそのまま入る）
  if (workStartMin !== null && workEndMinRaw !== null) {
    const endClamped = workEndMinRaw > workStartMin ? workEndMinRaw : 1440;
    const workContent = (ttInfo && ttInfo.label) ? ttInfo.label : '仕事';
    bands.push({ type:'work', start:workStartMin, end:endClamped, bg:'#DCEBFB', fg:'#0C447C',
      label:`🚌 ${workContent}`, timeLabel:`${fmtHM(workStartMin)}〜${fmtHM(endClamped)}` });
  }

  // プライベート予定（時刻設定ありのもののみ。未設定は別リストで表示）
  const rec = appData[dateKey] || {};
  const events = rec.events || [];
  events.forEach((e, idx) => {
    if (!e.timeStart) return;
    const sMinRaw = parseHM(e.timeStart);
    if (sMinRaw === null) return;
    const eMinRaw = e.timeEnd ? parseHM(e.timeEnd) : null;

    const dStart = e.dateStart || dateKey;
    const dEnd   = e.dateEnd   || dStart;
    const isMultiDay  = dStart !== dEnd;
    const isFirstDay  = dateKey === dStart;
    const isLastDay   = dateKey === dEnd;

    let sMin, eMin;
    if (isMultiDay) {
      // 複数日予定は時刻の大小に関係なく、初日=開始〜24:00／最終日=0:00〜終了／中日=終日 で分割する
      if (isFirstDay)      { sMin = sMinRaw; eMin = 1440; }
      else if (isLastDay)  { sMin = 0;       eMin = (eMinRaw !== null ? eMinRaw : 1440); }
      else                 { sMin = 0;       eMin = 1440; }
    } else {
      sMin = sMinRaw;
      eMin = (eMinRaw === null || eMinRaw <= sMinRaw) ? sMinRaw + 30 : eMinRaw;
    }

    // 複数日にわたる予定は、開始日・終了日を含めたラベルを全ての該当日に表示する
    const timeLabel = isMultiDay
      ? `${fmtMonthDay(dStart)}${e.timeStart}〜${fmtMonthDay(dEnd)}${eMinRaw !== null ? fmtHM(eMinRaw) : fmtHM(eMin)}`
      : `${fmtHM(sMin)}〜${fmtHM(eMin)}`;

    const icList = e.icons || (e.icon ? [{icon:e.icon, label:e.label||''}] : []);
    const mainIcon = icList[0] ? icList[0].icon : '';
    const meta = getIconMeta(mainIcon);
    const bg = getCategoryColor(meta.colorGroupKey);
    const labelDisp = icList.map(ic => ic.label).join('・');
    const name = e.place || labelDisp;
    bands.push({
      type:'private', start:sMin, end:eMin, bg, fg:'#2b3b28',
      label:`${renderIconDisp(mainIcon,12)} ${name}`,
      timeLabel,
      subLabel: meta.subLabel || meta.categoryLabel,
      eventIdx: idx, dateKey
    });
  });

  return bands;
}

// 重なりのある帯をグループ化し、各帯を自身の実時間全体で均等分割する
function layoutBands(bands) {
  const sorted = bands.slice().sort((a,b) => a.start - b.start || a.end - b.end);
  const clusters = [];
  let cur = [], curMaxEnd = -1;
  sorted.forEach(b => {
    if (cur.length === 0 || b.start < curMaxEnd) {
      cur.push(b);
      curMaxEnd = Math.max(curMaxEnd, b.end);
    } else {
      clusters.push(cur);
      cur = [b];
      curMaxEnd = b.end;
    }
  });
  if (cur.length) clusters.push(cur);

  const laidOut = [];
  clusters.forEach(cluster => {
    const n = cluster.length;
    cluster.forEach((b, colIdx) => laidOut.push({ ...b, colIdx, colCount: n }));
  });
  return laidOut;
}

// 帯の高さ・列数（幅）から、収まる範囲でできるだけ大きい文字サイズを決める
function bandFontStyle(heightPx, colCount) {
  const narrow = colCount > 1;
  let cat, time;
  if (heightPx >= 200)      { cat = 20; time = 18; }
  else if (heightPx >= 120) { cat = 17; time = 16; }
  else if (heightPx >= 70)  { cat = 15; time = 14; }
  else if (heightPx >= 45)  { cat = 13; time = 13; }
  else                      { cat = 12; time = 12; }
  if (narrow) { cat = Math.max(11, cat - 2); time = Math.max(11, time - 2); }
  return { cat, time, compact: heightPx < 45 };
}

function renderTimelineHtml(dateKey) {
  const laidOut = layoutBands(buildTimelineBands(dateKey));

  let hourLabelsHtml = '';
  let gridlinesHtml = '';
  for (let h = 0; h <= 24; h += 1) {
    hourLabelsHtml += `<div class="tl-hour-label" style="top:${h*60*TL_PX_PER_MIN}px;">${h}:00</div>`;
    gridlinesHtml  += `<div class="tl-gridline" style="top:${h*60*TL_PX_PER_MIN}px;"></div>`;
  }

  const bandsHtml = laidOut.map(b => {
    const top = b.start * TL_PX_PER_MIN;
    const height = Math.max((b.end - b.start) * TL_PX_PER_MIN, 16);
    const width = 100 / b.colCount;
    const left = b.colIdx * width;
    const isPrivate = b.type === 'private';
    const clickAttr = isPrivate ? ` onclick="showEventDetail('${b.dateKey}',${b.eventIdx})"` : '';
    const cursorCss = isPrivate ? 'cursor:pointer;' : '';

    const fs = bandFontStyle(height, b.colCount);
    const timeAndDur = b.timeLabel ? (b.durLabel ? `${b.timeLabel}　${b.durLabel}` : b.timeLabel) : '';
    let innerHtml;
    if (fs.compact) {
      const oneLine = [b.label, timeAndDur].filter(Boolean).join(' ');
      innerHtml = `<div class="tl-band-cat" style="font-size:${fs.cat}px;white-space:nowrap;">${oneLine}</div>`;
    } else {
      innerHtml = `<div class="tl-band-cat" style="font-size:${fs.cat}px;">${b.label}</div>`
        + (timeAndDur ? `<div class="tl-band-time" style="font-size:${fs.time}px;">${timeAndDur}</div>` : '')
        + (b.subLabel ? `<div class="tl-band-sub">${b.subLabel}</div>` : '');
    }
    return `<div class="tl-band"${clickAttr} style="top:${top}px;height:${height}px;left:${left}%;width:${width}%;background:${b.bg};color:${b.fg};${cursorCss}">${innerHtml}</div>`;
  }).join('');

  let nowHtml = '';
  if (dateKey === fmtDate(today)) {
    const now = new Date();
    const top = (now.getHours()*60 + now.getMinutes()) * TL_PX_PER_MIN;
    nowHtml = `<div class="tl-now-line" style="top:${top}px;"></div><div class="tl-now-dot" style="top:${top-4}px;"></div>`;
  }

  return `<div class="tl-wrap">
    <div class="tl-body" style="height:${TL_TOTAL_H}px;">
      <div class="tl-hours" style="height:${TL_TOTAL_H}px;">${hourLabelsHtml}</div>
      <div class="tl-track" style="height:${TL_TOTAL_H}px;">${gridlinesHtml}${bandsHtml}${nowHtml}</div>
    </div>
  </div>`;
}

function renderDay() {
  const c = document.getElementById('viewContainer');
  const key = selectedDate;
  const rec = appData[key] || {};
  const events = rec.events || [];
  const diary  = rec.diary  || null;

  const timelineHtml = renderTimelineHtml(key);

  // 時刻未設定の予定（タイムラインとは別リストで、日記カードの上に表示）
  const unscheduled = events.map((e,i)=>({e,i})).filter(({e}) => !e.timeStart);
  let unschedHtml = '';
  if (unscheduled.length > 0) {
    const chips = unscheduled.map(({e,i}) => {
      const icList = e.icons || (e.icon ? [{icon:e.icon, label:e.label||''}] : []);
      const mainIcon = icList[0] ? icList[0].icon : '';
      const meta = getIconMeta(mainIcon);
      const labelDisp = icList.map(ic => ic.label).join('・');
      const name = e.place || labelDisp;
      const catName = meta.subLabel || meta.categoryLabel;
      return `<div class="tl-unscheduled-chip" onclick="startEdit('${key}',${i})">
        <span>${renderIconDisp(mainIcon,16)}</span>
        <div>
          <div class="tl-unscheduled-name">${name}</div>
          ${catName ? `<div class="tl-unscheduled-cat">${catName}</div>` : ''}
        </div>
      </div>`;
    }).join('');
    unschedHtml = `<div class="tl-unscheduled">
      <div class="tl-unscheduled-label">時刻未設定</div>
      <div class="tl-unscheduled-list">${chips}</div>
    </div>`;
  }

  // 日記カード
  let diaryHtml = '';
  if (diary) {
    const dIconsHtml = (diary.icons||[]).map(ic =>
      `<div class="diary-chip"><div class="dc-icon">${ic.icon}</div><div class="dc-label">${ic.label}</div></div>`
    ).join('');
    diaryHtml = `
      ${dIconsHtml ? `<div class="diary-chips">${dIconsHtml}</div>` : ''}
      ${diary.text ? `<div class="diary-memo">${diary.text}</div>` : ''}`;
  } else {
    diaryHtml = `<div class="diary-empty">📓 まだ記録がありません</div>`;
  }

  c.innerHTML = `<div class="day-view">
    ${timelineHtml}
    ${unschedHtml}
    <div class="diary-day-card">
      <div class="diary-day-head">
        <span>📓 今日の記録</span>
      </div>
      <div class="diary-day-body">${diaryHtml}</div>
    </div>
  </div>`;

  // 現在時刻付近まで自動スクロール
  if (key === fmtDate(today)) {
    requestAnimationFrame(() => {
      const nowLine = c.querySelector('.tl-now-line');
      if (nowLine) nowLine.scrollIntoView({ block:'center', behavior:'instant' });
    });
  }
}

function renderToday() {
  const c = document.getElementById('viewContainer');
  const key = fmtDate(today);
  const rec = appData[key] || {};
  const events = (rec.events || []).map((e,i) => ({ e, i }));

  // 時刻あり→時刻順、時刻なし→末尾
  events.sort((a,b) => {
    const at = a.e.timeStart ? parseHM(a.e.timeStart) : 9999;
    const bt = b.e.timeStart ? parseHM(b.e.timeStart) : 9999;
    return at - bt;
  });

  const cardsHtml = events.map(({e,i}) => {
    const icList = e.icons || (e.icon ? [{icon:e.icon, label:e.label||''}] : []);
    const mainIcon = icList[0] ? icList[0].icon : '';
    const meta = getIconMeta(mainIcon);

    const labelDisp = icList.map(ic => ic.label).join('・');
    const name = e.place || labelDisp || meta.subLabel || meta.categoryLabel || '予定';
    const timeLabel = e.timeStart ? (e.timeEnd ? `${e.timeStart}〜${e.timeEnd}` : e.timeStart) : '時刻未設定';

    return `<div class="today-card" onclick="showEventDetail('${key}',${i})" style="border-left:4px solid ${bg};">

      </div>
    </div>`;
  }).join('');

  c.innerHTML = `<div class="day-view">

}

function getPlaceHistory() {
  try { return JSON.parse(localStorage.getItem('irodori_places') || '[]'); } catch { return []; }

// アイコンごとの場所履歴を取得（複数アイコンの場合は合算・重複排除）
function getPlaceHistoryForIcons(iconKeys) {
  try {
    const all = JSON.parse(localStorage.getItem('irodori_places_by_icon') || '{}');
    // 全アイコンの履歴を合算して重複排除
    const merged = [];
    const seen = new Set();
    iconKeys.forEach(key => {
      (all[key] || []).forEach(p => {
        if (!seen.has(p)) { seen.add(p); merged.push(p); }
      });
    });
    // アイコン別履歴がない場合は共通履歴にフォールバック
    if (merged.length === 0) return getPlaceHistory();
    return merged;
  } catch { return getPlaceHistory(); }
}

function savePlaceHistory(place, iconKeys) {
  if (!place) return;
  // 共通履歴
  let hist = getPlaceHistory();
  hist = [place, ...hist.filter(p => p !== place)].slice(0, 30);
  localStorage.setItem('irodori_places', JSON.stringify(hist));
  // アイコン別履歴
  try {
    const all = JSON.parse(localStorage.getItem('irodori_places_by_icon') || '{}');
    (iconKeys || []).forEach(key => {
      let ih = all[key] || [];
      ih = [place, ...ih.filter(p => p !== place)].slice(0, 20);
      all[key] = ih;
    });
    localStorage.setItem('irodori_places_by_icon', JSON.stringify(all));
  } catch {}
}

function registerEvent() {
  const fs = formState;
  if (!fs.icons || fs.icons.length === 0) { showToast('⚠️ アイコンを選択してください'); return; }

  const dateStart = fs.dateStart || inputDate || selectedDate;
  const dateEnd   = fs.dateEnd   || dateStart;

  // 編集モードの場合は先に古いデータを全日から削除
  if (editMode && editDateKey) {
    const oldEv = appData[editDateKey]?.events?.[editEventIdx];
    if (oldEv) {
      const oldStart = new Date(oldEv.dateStart || editDateKey);
      const oldEnd   = new Date(oldEv.dateEnd   || oldEv.dateStart || editDateKey);
      let cur = new Date(oldStart);
      while (cur <= oldEnd) {
        const key = fmtDate(cur);
        if (appData[key]?.events) {
          appData[key].events = appData[key].events.filter(e =>
            !(e.dateStart === oldEv.dateStart && (e.icon === oldEv.icon || JSON.stringify(e.icons) === JSON.stringify(oldEv.icons)) && e.place === oldEv.place)
          );
        }
        cur.setDate(cur.getDate() + 1);
      }
    }
  }

  // 代表アイコン（後方互換のため先頭を保持）
  const primaryIcon  = fs.icons[0]?.icon  || '';
  const primaryLabel = fs.icons[0]?.label || '';

  const eventData = {
    icons: fs.icons,
    icon:  primaryIcon,
    label: primaryLabel,
    place: fs.place,
    dateStart, dateEnd,
    timeStart: fs.timeStart,
    timeEnd:   fs.timeEnd,
    memo: fs.memo,
    isMultiDay: dateStart !== dateEnd,
  };

  const start = new Date(dateStart);
  const end   = new Date(dateEnd);
  let cur = new Date(start);
  while (cur <= end) {
    const key = fmtDate(cur);
    if (!appData[key]) appData[key] = {};
    if (!appData[key].events) appData[key].events = [];
    appData[key].events = appData[key].events.filter(e =>
      !(e.dateStart === dateStart && (e.icon === primaryIcon || JSON.stringify(e.icons) === JSON.stringify(fs.icons)) && e.place === fs.place)
    );
    appData[key].events.push(eventData);
    cur.setDate(cur.getDate() + 1);
  }

  if (fs.place) savePlaceHistory(fs.place, fs.icons.map(ic => ic.icon));

  const wasEditing = editMode;
  formState    = { icons:[], place:'', dateStart:'', dateEnd:'', timeStart:'', timeEnd:'', memo:'' };
  inputStep    = 'icons';
  editMode     = false;
  editDateKey  = null;
  editEventIdx = null;

  saveData(appData);
  selectedDate = dateStart;
  showToast(wasEditing ? '更新しました ✓' : '登録しました ✓');
  switchView(wasEditing ? detailFromView : 'day');
}

function deleteEvent(dateKey, idx) {
  if (!appData[dateKey] || !appData[dateKey].events) return;
  const ev = appData[dateKey].events[idx];
  // 日跨りイベントなら全日から削除
  if (ev && ev.isMultiDay && ev.dateStart && ev.dateEnd) {
    const start = new Date(ev.dateStart);
    const end   = new Date(ev.dateEnd);
    let cur = new Date(start);
    while (cur <= end) {
      const key = fmtDate(cur);
      if (appData[key] && appData[key].events) {
        appData[key].events = appData[key].events.filter(e =>
          !(e.dateStart === ev.dateStart && e.icon === ev.icon && e.place === ev.place)
        );
      }
      cur.setDate(cur.getDate() + 1);
    }
  } else {
    appData[dateKey].events.splice(idx, 1);
  }
  saveData(appData);
  renderDay();
}

      </div>
    </div>
  </div>`;

let qrStream = null;
let qrAnimFrame = null;

async function startQrScan() {
  try {
    qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('qrVideo');
    if (!video) return;
    video.srcObject = qrStream;
    await video.play();
    document.getElementById('qrStatus').textContent = 'QRコードをかざしてください';
    scanQrFrame(video);
  } catch(e) {
    const el = document.getElementById('qrStatus');
    if (el) el.textContent = 'カメラへのアクセスが許可されていません';
  }
}

function scanQrFrame(video) {
  if (!document.getElementById('qrVideo')) { stopQrScan(); return; }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  try {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    if (window.jsQR) {
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code) {
        stopQrScan();
        parseJahisQr(code.data);
        return;
      }
    }
  } catch(e) {}
  qrAnimFrame = requestAnimationFrame(() => scanQrFrame(video));
}

function stopQrScan() {
  if (qrStream) { qrStream.getTracks().forEach(t => t.stop()); qrStream = null; }
  if (qrAnimFrame) { cancelAnimationFrame(qrAnimFrame); qrAnimFrame = null; }
}

function parseJahisQr(data) {
  try {
    const lines = data.split(/\r?\n/);
    let drugName = '', hospital = '', date = fmtDate(new Date()), days = '', total = '';
    lines.forEach(line => {
      const parts = line.split(',');
      const no = parts[0];
      if (no === '101' && parts[4]) hospital = parts[4];
      if (no === '201' && parts[2]) date = parts[2].replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
      if (no === '281') { if(parts[2]) drugName = parts[2]; if(parts[7]) total = parts[7]; if(parts[8]) days = parts[8]; }
    });
    editMode = false;
    okusuriSelected = null;
    okusuriForm = { name: drugName, date, hospital, total, days, timings:[{ time:'', meal:'', amount:1, unit:'錠' }], memo:'', status:'active' };
    showToast('QR読み取り完了 ✓');
    switchView('okusuri_input');
  } catch(e) {
    showToast('QRの読み取りに失敗しました');
    switchView('okusuri');
  }
}

// カテゴリー色設定 VIEW
// ══════════════════════════════════════════
let colorPaletteOpenKey = null;

function renderColorSettings() {
  const c = document.getElementById('viewContainer');
  const usedColors = new Set(Object.values(categoryColors));

  const rows = COLOR_GROUPS.map(g => {
    const cur = categoryColors[g.key];
    const locked = !!cur && !colorSettingsEditMode;
    const swatchHtml = cur
      ? `<div style="width:34px;height:34px;border-radius:8px;background:${cur};border:1px solid var(--border);"></div>`
      : `<div style="width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1.5px dashed var(--border);"></div>`;

    let paletteHtml = '';
    if (colorPaletteOpenKey === g.key) {
      const swatches = CATEGORY_COLOR_PALETTE.map(col => {
        const takenByOther = usedColors.has(col) && cur !== col;
        return `<div onclick="${takenByOther ? '' : `pickCategoryColor('${g.key}','${col}')`}"
          style="position:relative;width:26px;height:26px;border-radius:6px;background:${col};
          border:${cur===col?'2px solid var(--green2)':'1px solid var(--border)'};
          cursor:${takenByOther?'not-allowed':'pointer'};opacity:${takenByOther?'0.35':'1'};">
          ${takenByOther ? `<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#a01010;font-weight:900;">×</span>` : ''}
        </div>`;
      }).join('');
      paletteHtml = `<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px;padding:10px;background:var(--surface2);border-radius:10px;">${swatches}</div>`;
    }

    return `<div style="background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:12px;">
        ${swatchHtml}
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;color:var(--text);">${g.shortLabel}</div>
        </div>
        <button class="small-btn" ${locked?'disabled style="opacity:.4;cursor:not-allowed;"':''}
          onclick="colorPaletteOpenKey = (colorPaletteOpenKey==='${g.key}') ? null : '${g.key}'; renderColorSettings();">
          ${cur ? '変更' : '選択'}
        </button>
      </div>
      ${paletteHtml}
    </div>`;
  }).join('');

  c.innerHTML = `<div style="padding:16px;max-width:620px;margin:0 auto 80px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <button class="small-btn" onclick="switchView('kino')">← 戻る</button>
      <button class="small-btn ${colorSettingsEditMode?'':'amber'}" onclick="colorSettingsEditMode=!colorSettingsEditMode;colorPaletteOpenKey=null;renderColorSettings();">
        ${colorSettingsEditMode ? '🔓 編集モード：ON' : '🔒 編集モード：OFF'}
      </button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">
      一度確定した色は「編集モード」をONにしないと変更できません。他のカテゴリーで使用中の色は選択できません（×表示）。
    </div>
    ${rows}
  </div>`;
}

function pickCategoryColor(key, color) {
  categoryColors[key] = color;
  saveCategoryColors(categoryColors);
  colorPaletteOpenKey = null;
  showToast('色を設定しました ✓');
  renderColorSettings();
}

// ══════════════════════════════════════════
// OKUSURI VIEW（お薬手帳一覧）
// ══════════════════════════════════════════
function renderOkusuri() {
  okusuriData = loadOkusuriData();
  const c = document.getElementById('viewContainer');
  const rows = okusuriData.map((drug, i) => {
    const statusMap = { active:'服用中', continuous:'継続処方', done:'終了' };
    const statusBg  = { active:'#d4f5e5', continuous:'#fff0d9', done:'#ebebeb' };
    const statusCol = { active:'#0a5e2a', continuous:'#a05000', done:'#555' };
    const st = drug.status || 'active';
    const lastDose = drug.history && drug.history.length > 0 ? drug.history[drug.history.length-1].date : '';
    const yoho = (drug.timings||[]).map(t=>`${t.time||''}${t.meal||''}・${t.amount||1}${t.unit||'錠'}`).join(' / ');
    return `
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div style="flex:1;" onclick="okusuriSelected=${i};switchView('okusuri_detail')">
          <div style="font-size:14px;font-weight:700;color:var(--text);">${drug.name}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">${yoho}</div>
          <div style="font-size:11px;color:var(--muted);">処方：${lastDose} / ${drug.hospital||''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;">
          <span style="font-size:10px;background:${statusBg[st]};color:${statusCol[st]};border-radius:4px;padding:2px 7px;font-weight:700;">${statusMap[st]||'服用中'}</span>
          <div style="display:flex;gap:5px;">
            <button onclick="okusuriSelected=${i};editMode=true;switchView('okusuri_input')" style="font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:3px 8px;cursor:pointer;color:var(--text);">✏️ 編集</button>
            <span onclick="okusuriSelected=${i};switchView('okusuri_detail')" style="font-size:16px;color:var(--green2);cursor:pointer;">›</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  c.innerHTML = `
  <div style="padding:0 0 80px;">
    <div style="padding:10px 14px;display:flex;gap:8px;">
      <button onclick="switchView('okusuri_qr')" style="flex:1;background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);">📷 QRコード読み取り</button>
      <button onclick="editMode=false;okusuriSelected=null;initOkusuriForm();switchView('okusuri_input')" style="flex:1;background:var(--surface);color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);">✏️ 手入力</button>
    </div>
    <div style="background:var(--surface);border:1.5px solid var(--border);border-radius:14px;margin:0 14px;overflow:hidden;box-shadow:var(--shadow);">
      <div style="padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--text);">処方履歴</div>
      ${okusuriData.length === 0
        ? `<div style="text-align:center;padding:30px;font-size:13px;color:var(--muted);">まだ登録されていません</div>`
        : rows}
    </div>
  </div>`;
}

// ══════════════════════════════════════════
// OKUSURI INPUT VIEW（お薬登録・編集）
// ══════════════════════════════════════════
editMode = false;
let okusuriForm = { name:'', date:'', hospital:'', total:'', days:'', timings:[], memo:'', status:'active' };

function initOkusuriForm() {
  if (editMode && okusuriSelected !== null) {
    const d = okusuriData[okusuriSelected];
    okusuriForm = JSON.parse(JSON.stringify(d));
  } else {
    okusuriForm = { name:'', date:fmtDate(new Date()), hospital:'', total:'', days:'', timings:[{ time:'', meal:'', amount:1, unit:'錠' }], memo:'', status:'active' };
  }
}

function renderOkusuriInput() {
  if (!okusuriForm.timings || okusuriForm.name === undefined) initOkusuriForm();
  const c = document.getElementById('viewContainer');

  const timingRows = okusuriForm.timings.map((t, ti) => {
    const times = ['朝','昼','夕','寝前'];
    const meals = ['食前','食後','食間'];
    const units = ['錠','袋','滴'];
    const unitBtns = units.map(un => `<button onclick="setOkusuriTiming(${ti},'unit','${un}')" style="font-size:12px;padding:5px 9px;border-radius:7px;border:${t.unit===un?'1.5px solid var(--green2)':'1px solid var(--border)'};background:${t.unit===un?'var(--surface2)':'var(--surface)'};color:${t.unit===un?'var(--green2)':'var(--muted)'};font-weight:${t.unit===un?'700':'400'};cursor:pointer;font-family:var(--sans);">${un}</button>`).join('');

    if (t.unit === '滴') {
      const summary = `1日${t.amount||1}滴`;
      return `
      <div style="border-left:3px solid var(--green);padding-left:10px;margin-bottom:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span style="font-size:11px;font-weight:700;color:var(--green2);">点眼液</span>
          ${okusuriForm.timings.length > 1 ? `<button onclick="removeTiming(${ti})" style="font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;">✕ 削除</button>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
          <span style="font-size:13px;color:var(--green2);font-weight:500;">1日</span>
          <div style="display:flex;align-items:center;gap:6px;background:var(--surface2);border:1.5px solid var(--green);border-radius:8px;padding:3px 12px;">
            <button onclick="changeAmount(${ti},-1)" style="font-size:14px;color:var(--green2);background:none;border:none;cursor:pointer;font-family:var(--sans);">－</button>
            <span style="font-size:16px;font-weight:700;color:var(--text);min-width:20px;text-align:center;">${t.amount||1}</span>
            <button onclick="changeAmount(${ti},1)" style="font-size:14px;color:var(--green2);background:none;border:none;cursor:pointer;font-family:var(--sans);">＋</button>
          </div>
          <span style="font-size:13px;color:var(--green2);font-weight:500;">滴</span>
          <div style="background:var(--surface2);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--green2);font-weight:700;">→ ${summary}</div>
        </div>
        <div style="display:flex;gap:5px;">${unitBtns}</div>
      </div>`;
    }

    const timeBtns = times.map(tm => `<button onclick="setOkusuriTiming(${ti},'time','${tm}')" style="font-size:12px;padding:5px 9px;border-radius:7px;border:${t.time===tm?'1.5px solid var(--green2)':'1px solid var(--border)'};background:${t.time===tm?'var(--surface2)':'var(--surface)'};color:${t.time===tm?'var(--green2)':'var(--muted)'};font-weight:${t.time===tm?'700':'400'};cursor:pointer;font-family:var(--sans);">${tm}</button>`).join('');
    const mealBtns = meals.map(ml => `<button onclick="setOkusuriTiming(${ti},'meal','${ml}')" style="font-size:12px;padding:5px 9px;border-radius:7px;border:${t.meal===ml?'1.5px solid var(--green2)':'1px solid var(--border)'};background:${t.meal===ml?'var(--surface2)':'var(--surface)'};color:${t.meal===ml?'var(--green2)':'var(--muted)'};font-weight:${t.meal===ml?'700':'400'};cursor:pointer;font-family:var(--sans);">${ml}</button>`).join('');
    const summary = (t.time||'') + (t.meal ? '・'+t.meal : '') + '・' + (t.amount||1) + (t.unit||'錠');
    return `
    <div style="border-left:3px solid var(--green);padding-left:10px;margin-bottom:10px;">
      <div style="font-size:11px;font-weight:700;color:var(--green2);margin-bottom:6px;">${ti+1}回目</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px;">${timeBtns}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;">${mealBtns}</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span style="font-size:11px;color:var(--muted);">服用量</span>
        <div style="display:flex;align-items:center;gap:6px;background:var(--surface2);border:1.5px solid var(--green);border-radius:8px;padding:3px 10px;">
          <button onclick="changeAmount(${ti},-1)" style="font-size:14px;color:var(--green2);background:none;border:none;cursor:pointer;font-family:var(--sans);">－</button>
          <span style="font-size:13px;font-weight:700;color:var(--text);min-width:18px;text-align:center;">${t.amount||1}</span>
          <button onclick="changeAmount(${ti},1)" style="font-size:14px;color:var(--green2);background:none;border:none;cursor:pointer;font-family:var(--sans);">＋</button>
        </div>
        <div style="display:flex;gap:5px;">${unitBtns}</div>
        ${okusuriForm.timings.length > 1 ? `<button onclick="removeTiming(${ti})" style="margin-left:auto;font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;">✕ 削除</button>` : ''}
      </div>
      <div style="margin-top:6px;background:var(--surface2);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--green2);font-weight:700;display:inline-block;">→ ${summary}</div>
    </div>`;
  }).join('');

  const statusOpts = [['active','服用中'],['continuous','継続処方'],['done','終了']];
  const statusBtns = statusOpts.map(([val,lbl]) => `<button onclick="okusuriForm.status='${val}';renderOkusuriInput()" style="font-size:12px;padding:5px 12px;border-radius:7px;border:${okusuriForm.status===val?'1.5px solid var(--green2)':'1px solid var(--border)'};background:${okusuriForm.status===val?'var(--surface2)':'var(--surface)'};color:${okusuriForm.status===val?'var(--green2)':'var(--muted)'};font-weight:${okusuriForm.status===val?'700':'400'};cursor:pointer;font-family:var(--sans);">${lbl}</button>`).join('');

  c.innerHTML = `
  <div style="padding:0 14px 80px;max-width:620px;margin:0 auto;">
    <div style="background:var(--surface);border:1.5px solid var(--border);border-radius:14px;margin-top:10px;overflow:hidden;box-shadow:var(--shadow);">
      <div style="background:var(--surface2);padding:11px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--text);">💊 ${editMode?'お薬を編集':'お薬を登録する'}</div>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px;">

        <div class="field-group">
          <div class="field-label">薬の名前</div>
          <input class="place-inp" value="${okusuriForm.name||''}" placeholder="例）ロキソプロフェン錠 60mg" oninput="okusuriForm.name=this.value">
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div class="field-group">
            <div class="field-label">処方日</div>
            <input type="date" class="date-inp" value="${okusuriForm.date||fmtDate(new Date())}" oninput="okusuriForm.date=this.value">
          </div>
          <div class="field-group">
            <div class="field-label">病院・薬局名</div>
            <input class="place-inp" value="${okusuriForm.hospital||''}" placeholder="例）△△病院" oninput="okusuriForm.hospital=this.value">
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div class="field-group">
            <div class="field-label">処方量</div>
            <input class="place-inp" type="number" value="${okusuriForm.total||''}" placeholder="例）30" oninput="okusuriForm.total=this.value">
          </div>
          <div class="field-group">
            <div class="field-label">日数</div>
            <input class="place-inp" type="number" value="${okusuriForm.days||''}" placeholder="例）30" oninput="okusuriForm.days=this.value">
          </div>
        </div>

        <div class="field-group">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
            <div class="field-label" style="margin-bottom:0;">用法（服用タイミング）</div>
            <span style="font-size:12px;background:var(--surface2);border:1.5px solid var(--green);border-radius:7px;padding:3px 10px;color:var(--green2);font-weight:700;">1日${okusuriForm.timings.length}回</span>
          </div>
          ${timingRows}
          <button onclick="addTiming()" style="width:100%;border:1.5px dashed var(--green);border-radius:8px;padding:8px;font-size:12px;color:var(--green2);font-weight:700;background:var(--surface);cursor:pointer;font-family:var(--sans);">＋ 服用タイミングを追加</button>
        </div>

        <div class="field-group">
          <div class="field-label">ステータス</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">${statusBtns}</div>
        </div>

        <div class="field-group">
          <div class="field-label">備考・服用条件（任意）</div>
          <textarea class="memo-inp" placeholder="痛い時に服用。1日2回まで。など…" oninput="okusuriForm.memo=this.value">${okusuriForm.memo||''}</textarea>
        </div>

        <button onclick="saveOkusuriEntry()" class="reg-btn">💊 保存する</button>
        ${editMode ? `<button onclick="deleteOkusuri()" style="width:100%;background:none;border:1.5px solid var(--red);border-radius:10px;padding:11px;font-size:13px;font-weight:700;color:var(--red);cursor:pointer;font-family:var(--sans);margin-top:4px;">🗑️ この記録を削除</button>` : ''}
      </div>
    </div>
  </div>`;
}

function setOkusuriTiming(ti, key, val) {
  okusuriForm.timings[ti][key] = val;
  renderOkusuriInput();
}
function changeAmount(ti, delta) {
  okusuriForm.timings[ti].amount = Math.max(1, (okusuriForm.timings[ti].amount||1) + delta);
  renderOkusuriInput();
}
function addTiming() {
  okusuriForm.timings.push({ time:'', meal:'', amount:1, unit:'錠' });
  renderOkusuriInput();
}
function removeTiming(ti) {
  okusuriForm.timings.splice(ti, 1);
  renderOkusuriInput();
}
function saveOkusuriEntry() {
  if (!okusuriForm.name) { showToast('薬の名前を入力してください'); return; }
  okusuriData = loadOkusuriData();
  const entry = { ...okusuriForm, history: [] };
  if (editMode && okusuriSelected !== null) {
    entry.history = okusuriData[okusuriSelected].history || [];
  }
  const histEntry = { date: okusuriForm.date, hospital: okusuriForm.hospital, total: okusuriForm.total, days: okusuriForm.days };
  if (!editMode) {
    entry.history = [histEntry];
    okusuriData.push(entry);
  } else {
    const existing = entry.history.find(h => h.date === okusuriForm.date);
    if (!existing) entry.history.push(histEntry);
    okusuriData[okusuriSelected] = entry;
  }
  saveOkusuriData(okusuriData);
  editMode = false;
  okusuriSelected = null;
  okusuriForm = {};
  switchView('okusuri');
}
function deleteOkusuri() {
  if (!confirm('この記録を削除しますか？')) return;
  okusuriData = loadOkusuriData();
  okusuriData.splice(okusuriSelected, 1);
  saveOkusuriData(okusuriData);
  editMode = false;
  okusuriSelected = null;
  switchView('okusuri');
}

// ══════════════════════════════════════════
// OKUSURI DETAIL VIEW（薬の処方履歴詳細）
// ══════════════════════════════════════════
function renderOkusuriDetail() {
  okusuriData = loadOkusuriData();
  if (okusuriSelected === null) { switchView('okusuri'); return; }
  const drug = okusuriData[okusuriSelected];
  const c = document.getElementById('viewContainer');
  const history = drug.history || [];
  const totalCount = history.length;
  const totalUnits = history.reduce((s, h) => s + (parseInt(h.total)||0), 0);
  const avgDays = history.length > 0 ? Math.round(history.reduce((s,h)=>s+(parseInt(h.days)||0),0)/history.length) : 0;
  const yoho = (drug.timings||[]).map(t=>`${t.time||''}${t.meal?'・'+t.meal:''}・${t.amount||1}${t.unit||'錠'}`).join(' / ');
  const statusMap = { active:'服用中', continuous:'継続処方', done:'終了' };
  const statusBg  = { active:'#d4f5e5', continuous:'#fff0d9', done:'#ebebeb' };
  const statusCol = { active:'#0a5e2a', continuous:'#a05000', done:'#555' };
  const st = drug.status || 'active';

  const histRows = [...history].reverse().map(h => `
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text);">${h.date}　${h.hospital||''}</div>
          <div style="font-size:11px;color:var(--muted);">${h.total||''}${drug.timings?.[0]?.unit||'錠'} / ${h.days||''}日分</div>
        </div>
        <span style="font-size:10px;background:${statusBg[st]};color:${statusCol[st]};border-radius:4px;padding:2px 7px;font-weight:700;">${statusMap[st]}</span>
      </div>
    </div>`).join('');

  c.innerHTML = `
  <div style="padding:0 14px 80px;max-width:620px;margin:0 auto;">
    <div style="background:#e0f7fa;border:1.5px solid var(--workbd);border-radius:14px;margin-top:10px;overflow:hidden;box-shadow:var(--shadow);">
      <div style="background:#d4f2fa;padding:12px 16px;border-bottom:1px solid var(--workbd);">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-size:16px;font-weight:700;color:#007c91;">${drug.name}</div>
            <div style="font-size:11px;color:#007c91;margin-top:3px;">${yoho}</div>
            ${drug.memo ? `<div style="font-size:11px;color:#007c91;margin-top:2px;">📝 ${drug.memo}</div>` : ''}
          </div>
          <button onclick="okusuriSelected=${okusuriSelected};editMode=true;switchView('okusuri_input')" style="font-size:11px;background:#fff;border:1px solid var(--workbd);border-radius:7px;padding:4px 10px;cursor:pointer;color:#007c91;font-family:var(--sans);">✏️ 編集</button>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <div style="background:#fff;border-radius:8px;padding:6px 10px;text-align:center;flex:1;border:1px solid var(--workbd);">
            <div style="font-size:20px;font-weight:700;color:#007c91;">${totalCount}</div>
            <div style="font-size:9px;color:#007c91;">処方回数</div>
          </div>

// FIREBASE — IRODORIデータ専用ドキュメント
// ══════════════════════════════════════════
(async function initFirebase() {
  try {
    const { initializeApp }       = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getFirestore, doc, setDoc, onSnapshot, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

    const firebaseConfig = {
      apiKey: "AIzaSyCIqSyfHwHg5ygdyB5XA6KBsIDqiyLQLgU",
      authDomain: "schedule-app-d1ba4.firebaseapp.com",
      projectId: "schedule-app-d1ba4",
      storageBucket: "schedule-app-d1ba4.firebasestorage.app",
      messagingSenderId: "350863090121",
      appId: "1:350863090121:web:b3283d3895cdb0670c4818"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const docRef   = doc(db, "schedules", "irodori_mkdata");
    const ttDocRef = doc(db, "schedules", "mkdata");

    let isSavingLocally = false;

    function setSyncStatus(status) {
      const dot = document.getElementById('syncDot');
      const txt = document.getElementById('syncText');
      if (!dot || !txt) return;
      if (status === 'ok')      { dot.style.background='#2ecf7a'; txt.textContent='同期済み'; }
      else if (status==='syncing') { dot.style.background='#e08a10'; txt.textContent='同期中…'; }
      else                     { dot.style.background='#e03535'; txt.textContent='オフライン'; }
    }

    // IRODORIデータ と TTデータ を並列取得してから render
    try {
      const [snap, ttSnap] = await Promise.all([
        getDoc(docRef),
        getDoc(ttDocRef)
      ]);

      // TTデータをセット
      if (ttSnap.exists()) {
        window._ttCloudData = ttSnap.data().appData || {};
      }

      // IRODORIデータをセット
      if (snap.exists()) {
        const cloudData = snap.data().appData || {};
        Object.keys(cloudData).forEach(k => { appData[k] = cloudData[k]; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      } else {
        // クラウドにデータがない場合、ローカルデータをアップロード
        if (Object.keys(appData).length > 0) {
          await setDoc(docRef, { appData }, { merge: true });
        }
      }
      setSyncStatus('ok');
    } catch(e) {
      console.warn('IRODORI初回取得エラー:', e);
      setSyncStatus('offline');
    }

    // 両データ取得完了後に一度だけrender
    render();

    // リアルタイム購読（他デバイスの変更を反映）
    onSnapshot(ttDocRef, (snap) => {
      if (snap.exists()) {
        window._ttCloudData = snap.data().appData || {};
        render();
      }
    });

    onSnapshot(docRef, (snap) => {
      if (isSavingLocally) return;
      if (snap.exists()) {
        const cloudData = snap.data().appData || {};
        Object.keys(cloudData).forEach(k => { appData[k] = cloudData[k]; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        render();
      }
    });

    firestoreSave = async (d) => {
      isSavingLocally = true;
      try {
        await setDoc(docRef, { appData: d }, { merge: true });
        setSyncStatus('ok');
      } catch(e) {
        console.warn('IRODORI保存エラー:', e);
        setSyncStatus('offline');
      } finally {
        setTimeout(() => { isSavingLocally = false; }, 1000);
      }
    };

  } catch(e) {
    console.warn('Firebase初期化エラー:', e);
  }
})();

// 左右フリックで前後の月／日へ移動
// ══════════════════════════════════════════
(function initSwipeNav() {
  const el = document.getElementById('viewContainer');
  const SWIPE_MIN_DX = 55;   // 反応する最小移動量(px)
  const SWIPE_MAX_DY = 60;   // これ以上縦に動いたら無効（スクロールと誤認しない）
  const SWIPE_MAX_MS = 600;  // これより長い操作は無効
  let sx = 0, sy = 0, st = 0, tracking = false;

  el.addEventListener('touchstart', (ev) => {
    if (view !== 'month' && view !== 'day') { tracking = false; return; }
    if (ev.touches.length !== 1) { tracking = false; return; }
    sx = ev.touches[0].clientX;
    sy = ev.touches[0].clientY;
    st = Date.now();
    tracking = true;
  }, { passive: true });

  el.addEventListener('touchend', (ev) => {
    if (!tracking) return;
    tracking = false;
    const t = ev.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    const dt = Date.now() - st;
    if (dt > SWIPE_MAX_MS) return;
    if (Math.abs(dy) > SWIPE_MAX_DY) return;
    if (Math.abs(dx) < SWIPE_MIN_DX) return;
    if (dx < 0) navNext();  // 左へフリック → 次へ
    else        navPrev();  // 右へフリック → 前へ
  }, { passive: true });
})();
